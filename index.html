<style>
/* Layout: Fluxxu Pessoal — barra lateral escura com ícones, conteúdo em cartões arejados; cada módulo mantém sua cor e o status tem cor semântica */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --surface-2:#eef1f5; --line:#e1e6ec; --fg:#0b0d10; --muted:#5b6570;
  --side:#000000; --side-fg:#eef3f8; --side-muted:#8d97a3; --side-hover:rgba(255,255,255,.06); --side-on:rgba(255,255,255,.1);
  --accent:#0a7fc2; --accent-2:#38b6ff; --accent-fg:#ffffff;
  --c-pagar:#d64545; --c-receber:#1f9254; --c-cartao:#7b3fe4; --c-financiamento:#2563eb;
  --c-emprestimo:#d97706; --c-aquisicao:#0d9488; --c-devedor:#c0367f; --c-invest:#4f46e5; --c-conta:#5b6570; --c-painel:#0a7fc2; --c-fluxo:#0e7490; --c-dre:#0f766e;
  --ok:#1f9254; --warn:#c27803; --bad:#d64545; --idle:#6b7480;
  --shadow:0 1px 2px rgba(11,13,16,.04),0 8px 24px -12px rgba(11,13,16,.14);
  --shadow-lg:0 24px 60px -20px rgba(11,13,16,.35);
  --f-display:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0c0f; --surface:#13161a; --surface-2:#1b1f24; --line:#272c33; --fg:#eef2f6; --muted:#97a1ac;
  --side:#000000; --side-fg:#eef3f8; --side-muted:#848e9a; --side-hover:rgba(255,255,255,.05); --side-on:rgba(255,255,255,.09);
  --accent:#38b6ff; --accent-2:#0a7fc2; --accent-fg:#000000;
  --c-pagar:#f27c7c; --c-receber:#5fd08f; --c-cartao:#b59bff; --c-financiamento:#7fa8ff;
  --c-emprestimo:#f2ab4f; --c-aquisicao:#4fd1c5; --c-devedor:#f08cc2; --c-invest:#a29dff; --c-conta:#a7b0bb; --c-painel:#38b6ff; --c-fluxo:#4cc4dc; --c-dre:#5eead4;
  --ok:#5fd08f; --warn:#f2bb4f; --bad:#f27c7c; --idle:#97a1ac;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 24px 60px -20px rgba(0,0,0,.7); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0a0c0f; --surface:#13161a; --surface-2:#1b1f24; --line:#272c33; --fg:#eef2f6; --muted:#97a1ac;
  --side:#000000; --side-fg:#eef3f8; --side-muted:#848e9a; --side-hover:rgba(255,255,255,.05); --side-on:rgba(255,255,255,.09);
  --accent:#38b6ff; --accent-2:#0a7fc2; --accent-fg:#000000;
  --c-pagar:#f27c7c; --c-receber:#5fd08f; --c-cartao:#b59bff; --c-financiamento:#7fa8ff;
  --c-emprestimo:#f2ab4f; --c-aquisicao:#4fd1c5; --c-devedor:#f08cc2; --c-invest:#a29dff; --c-conta:#a7b0bb; --c-painel:#38b6ff; --c-fluxo:#4cc4dc; --c-dre:#5eead4;
  --ok:#5fd08f; --warn:#f2bb4f; --bad:#f27c7c; --idle:#97a1ac;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 24px 60px -20px rgba(0,0,0,.7); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
svg.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
/* Sidebar */
.side{background:var(--side);color:var(--side-fg);padding:22px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 8px}
.brand .lf{width:180px;height:auto;display:block}
.brand .lm{display:none;width:34px;height:34px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(140deg,#38b6ff,#0a7fc2);color:#fff;font-weight:800;font-size:18px;letter-spacing:-.04em;box-shadow:0 6px 18px -6px rgba(63,191,147,.6);flex:none}
.brand h1{font-family:var(--f-display);font-size:19px;line-height:1.1;margin:0;font-weight:800;letter-spacing:-.03em}
.brand p{margin:2px 0 0;color:var(--side-muted);font-size:11.5px}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navlabel{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--side-muted);padding:6px 12px 6px;font-weight:600}
.nav{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:11px;border:0;background:none;cursor:pointer;text-align:left;width:100%;color:var(--side-muted);font-weight:500;transition:background .15s,color .15s}
.nav:hover{background:var(--side-hover);color:var(--side-fg)}
.nav .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--mc);background:color-mix(in srgb,var(--mc) 16%,transparent);flex:none}
.nav .ico svg{width:16px;height:16px}
.nav.on{background:var(--side-on);color:var(--side-fg);font-weight:600}
.nav.on .ico{background:var(--mc);color:var(--side)}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--bad);color:#fff;border-radius:999px;padding:1px 7px;font-weight:700}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:2px;padding:12px 4px 0;border-top:1px solid rgba(255,255,255,.08)}
.sidefoot .btn{color:var(--side-muted);justify-content:flex-start;font-weight:500}
.sidefoot .btn:hover{background:var(--side-hover);color:var(--side-fg)}
.sync{font-size:12px;color:var(--side-muted);display:flex;align-items:center;gap:7px;padding:4px 10px 8px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--idle);display:inline-block}
.sync.cloud i{background:#38b6ff;box-shadow:0 0 0 3px rgba(56,182,255,.22)}
/* Main */
.main{padding-block:30px 72px;padding-inline:36px;min-width:0;display:flex;flex-direction:column;gap:22px;max-width:1440px;width:100%}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;justify-content:space-between}
.head h2{font-family:var(--f-display);font-size:28px;font-weight:800;margin:0;letter-spacing:-.035em;display:flex;align-items:center;gap:12px;line-height:1.1}
.head h2 .sw{width:42px;height:42px;border-radius:13px;background:color-mix(in srgb,var(--mc) 15%,var(--surface));color:var(--mc);display:grid;place-items:center;flex:none}
.head h2 .sw svg{width:21px;height:21px}
.head .sub{color:var(--muted);margin:6px 0 0;font-size:13.5px}
.monthnav{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.monthnav b{min-width:132px;text-align:center;font-weight:700;text-transform:capitalize;font-size:13.5px}
.icon-btn{border:0;background:none;width:32px;height:32px;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--muted);font-size:15px}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 18px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:filter .15s,background .15s,transform .1s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--mc,var(--accent));border-color:transparent;color:var(--surface);box-shadow:0 6px 16px -8px var(--mc,var(--accent))}
.btn.pri:hover{filter:brightness(1.08);background:var(--mc,var(--accent))}
.btn.sm{padding:6px 13px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--bad)}
.btn:focus-visible,.nav:focus-visible,.icon-btn:focus-visible,.pay:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);min-width:0}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.kpi .l::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--kc,var(--line));box-shadow:0 0 0 4px color-mix(in srgb,var(--kc,var(--line)) 18%,transparent);flex:none}
.kpi .v{font-size:23px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .d{font-size:12px;color:var(--muted)}
.pos{color:var(--ok)} .neg{color:var(--bad)}
/* Hero do painel */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px}
.hcard{border-radius:22px;padding:24px 26px;color:#fff;background:radial-gradient(120% 140% at 100% 0%,#38b6ff 0%,#0a7fc2 45%,#06334f 100%);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;gap:18px;position:relative;overflow:hidden;min-width:0}
.hcard::after{content:"";position:absolute;right:-60px;bottom:-80px;width:240px;height:240px;border-radius:50%;border:38px solid rgba(255,255,255,.06)}
.hcard .hl{font-size:13px;opacity:.8;font-weight:600}
.hcard .hv{font-size:40px;font-weight:800;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.hcard .hv.neg{color:#ffc2c2}
.hsplit{display:grid;grid-template-columns:1fr 1fr;gap:12px;position:relative;z-index:1}
.hbox{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.hbox .t{font-size:12px;opacity:.8;display:flex;align-items:center;gap:6px}
.hbox .t i{width:8px;height:8px;border-radius:50%;display:inline-block}
.hbox .n{font-size:19px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hbox .bar{background:rgba(255,255,255,.15);height:6px}
.hbox small{font-size:11.5px;opacity:.75}
.hside{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hside .kpi{justify-content:space-between}
/* Panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.panel h3{margin:0 0 16px;font-size:15px;font-family:var(--f-display);font-weight:700;letter-spacing:-.015em;display:flex;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:var(--shadow)}
.toolbar select,.toolbar input[type=search]{border:1px solid transparent;background:var(--surface-2);border-radius:10px;padding:8px 12px;min-width:0}
.toolbar input[type=search]{flex:1 1 200px}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);cursor:pointer;padding:0 6px}
.chk input{accent-color:var(--mc,var(--accent));width:16px;height:16px}
/* Tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
.panel .tw,.ccard .tw{box-shadow:none}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;color:var(--muted);font-weight:600;background:var(--surface);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--surface-2)}
tr.is-pago td{color:var(--muted)}
tr.is-pago .desc{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 50%,transparent)}
tfoot td{font-weight:700;background:var(--surface-2)}
.desc{font-weight:600}
.desc small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--cc) 13%,var(--surface));color:var(--cc);font-weight:600;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--cc)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.st-pago{background:color-mix(in srgb,var(--ok) 15%,var(--surface));color:var(--ok)}
.st-vencido{background:color-mix(in srgb,var(--bad) 15%,var(--surface));color:var(--bad)}
.st-vencido::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--bad)}
.st-proximo{background:color-mix(in srgb,var(--warn) 17%,var(--surface));color:var(--warn)}
.st-aberto{background:var(--surface-2);color:var(--muted)}
.pay{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:12px;cursor:pointer;font-weight:600;white-space:nowrap;transition:all .15s}
.pay:hover{border-color:var(--ok);color:var(--ok)}
.pay.done{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.acts{display:flex;gap:2px;justify-content:flex-end;align-items:center}
.empty{padding:40px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:6px;letter-spacing:-.01em}
/* Contract cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);min-width:0;position:relative;overflow:hidden}
.ccard::before{content:"";position:absolute;inset:0 0 auto 0;height:90px;background:linear-gradient(180deg,color-mix(in srgb,var(--mc) 11%,transparent),transparent);pointer-events:none}
.ccard > *{position:relative}
.ccard.wide{grid-column:1/-1}
.ccard h4{margin:0;font-family:var(--f-display);font-size:17px;font-weight:800;letter-spacing:-.025em}
.ccard .who{color:var(--muted);font-size:12.5px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px 16px}
.fact .l{font-size:11.5px;color:var(--muted);font-weight:500}
.fact .v{font-variant-numeric:tabular-nums;font-size:15px;font-weight:700;letter-spacing:-.01em}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--mc);border-radius:99px}
.prog{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
/* Chart */
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);flex-wrap:wrap;margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.hbars{display:flex;flex-direction:column;gap:12px}
tr.clk{cursor:pointer}tr.clk:hover td{background:color-mix(in srgb,var(--mc,var(--accent)) 5%,var(--surface))}tr.rc-on td{background:color-mix(in srgb,var(--mc,var(--accent)) 7%,var(--surface));border-bottom:0}
tr.rc-row>td{padding:4px 14px 14px;background:color-mix(in srgb,var(--mc,var(--accent)) 7%,var(--surface))}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;cursor:pointer;box-shadow:var(--shadow)}
.rcard h4{margin:0;font-size:15px}
.ccmini{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;color:#fff;border-radius:12px;padding:12px 14px;background:linear-gradient(135deg,var(--cc1),color-mix(in srgb,var(--cc1) 55%,#000))}
.ccmini b{display:block;font-size:14px}.ccmini small{opacity:.8;font-size:11.5px}.ccmini>span{font-family:ui-monospace,monospace;letter-spacing:.1em;font-size:13px}.ccmini>small{grid-column:1/-1}
.rc-ps.rc-fat div{grid-template-columns:44px minmax(0,1fr) auto auto auto}.rc-ps.rc-fat div>span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ccmini{max-width:440px}
.cc-this{font-size:13px;color:var(--muted)}.cc-this b{color:var(--fg)}.rc-ps .muted{color:var(--muted);font-size:12px}.rcard .who{color:var(--muted);font-size:12.5px;margin-top:2px}
.rcard .facts{grid-template-columns:repeat(4,minmax(0,1fr))}
.rc-ps{display:flex;flex-direction:column;max-height:300px;overflow:auto;border-top:1px solid var(--line);cursor:default}
.rc-ps div{display:grid;grid-template-columns:52px 96px 1fr auto auto auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.rc-ps .is-pago{color:var(--muted)}.rc-ps .cur{font-weight:700}.rc-ps .pay.sm{padding:3px 10px;font-size:11.5px}
@media (max-width:700px){.rc-ps.rc-fat div{grid-template-columns:36px minmax(0,1fr) auto auto}.rc-ps.rc-fat div>span.muted{display:none}.rc-ps.rc-fat div>span:nth-child(2){display:block!important}.rcard .facts{grid-template-columns:1fr 1fr}.rc-ps div{grid-template-columns:44px 1fr auto auto}.rc-ps div .pill,.rc-ps div>span:nth-child(2){display:none}}
.mcards-w{margin:0 0 14px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.mcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;width:100%;align-items:start}

<script>
(() => {
"use strict";
/* ============ Configuração ============ */
const MODS = {
  financiamento:{label:"Financiamentos",sing:"Financiamento",nat:"pagar",parte:"Banco / financeira",parteHint:"Ex.: Caixa, Itaú, Santander",obj:"Bem financiado",objHint:"Ex.: Apartamento, carro"},
  emprestimo:{label:"Empréstimos",sing:"Empréstimo",nat:"pagar",parte:"Instituição / credor",parteHint:"Ex.: Nubank, consignado, pessoa",obj:"Finalidade",objHint:"Ex.: Capital de giro, reforma"},
  aquisicao:{label:"Aquisições",sing:"Aquisição",nat:"pagar",parte:"Loja / vendedor",parteHint:"Ex.: Magazine, concessionária",obj:"Bem adquirido",objHint:"Ex.: Geladeira, notebook, terreno"},
  devedor:{label:"Devedores",sing:"Dívida a receber",nat:"receber",parte:"Devedor (pessoa/empresa)",parteHint:"Quem deve para você",obj:"Motivo",objHint:"Ex.: Empréstimo pessoal, venda"},
};
const ORIGENS = {conta:"Conta",cartao:"Cartão",financiamento:"Financiamento",emprestimo:"Empréstimo",aquisicao:"Aquisição",devedor:"Devedor",invest:"Investimento"};
const CATS = {
  pagar:["Moradia","Alimentação","Mercado","Transporte","Combustível","Saúde","Educação","Lazer","Contas de consumo","Internet/Telefone","Assinaturas","Impostos","Seguros","Vestuário","Pessoal","Pets","Viagem","Outros"],
  receber:["Salário","Pró-labore","Distribuição de lucros","Aluguel recebido","Vendas","Serviços","Dividendos","Reembolso","Outros"],
};
const FORMAS = ["Pix","Boleto","Débito automático","Transferência","Dinheiro","Débito"];
const INV_TIPOS = ["CDB","LCI/LCA","Tesouro Direto","Poupança","Fundo","Ações","FII","Previdência","Cripto","Imóvel","Outro"];
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const MES_AB = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];

/* ============ Utilidades ============ */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl = new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const money = v => brl.format(Number(v)||0);
const pctf = (v,d=2) => (Number(v)||0).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d})+"%";
const r2 = v => Math.round((Number(v)||0)*100)/100;
const sum = (a,f=x=>x) => a.reduce((s,x)=>s+(Number(f(x))||0),0);
const pad = n => String(n).padStart(2,"0");
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function todayStr(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function addDays(s,k){const [y,m,d]=s.split("-").map(Number);const t=new Date(y,m-1,d+k);return `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`;}
function addMonths(s,k){const [y,m,d]=s.split("-").map(Number);const t=new Date(y,m-1+k,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();return `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(Math.min(d,last))}`;}
function shiftMonth(mk,k){return addMonths(mk+"-01",k).slice(0,7);}
const dt = s => s ? s.slice(8,10)+"/"+s.slice(5,7)+"/"+s.slice(0,4) : "—";
const mesNome = mk => MESES[+mk.slice(5,7)-1]+" "+mk.slice(0,4);
const mesCurto = mk => MES_AB[+mk.slice(5,7)-1]+"/"+mk.slice(2,4);
function parseMoney(s){
  if (typeof s==="number") return s;
  s = String(s||"").replace(/[R$\s]/g,"");
  if (!s) return 0;
  if (s.includes(",")) s = s.replace(/\./g,"").replace(",",".");
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,"");
  const n = parseFloat(s); return isFinite(n)?n:0;
}
const mIn = v => (v===undefined||v===null||v==="") ? "" : String(r2(v)).replace(".",",");
const clone = o => JSON.parse(JSON.stringify(o));
function compact(v){const a=Math.abs(v);if(a>=1e6)return "R$ "+(v/1e6).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mi";if(a>=1e3)return "R$ "+(v/1e3).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mil";return "R$ "+Math.round(v);}

/* ============ Armazenamento ============ */
const LSKEY = "money-web";
let recs = new Map();
let mode = "cloud";
const queues = new Map();
function saveRec(rec){
  rec = clone(rec); rec.atualizado = new Date().toISOString();
  recs.set(rec.id, rec); scheduleRender();
  if (!sb || !uidAtual) return Promise.resolve();
  const linha = {user_id:uidAtual, id:rec.id, tipo:rec.tipo||"", dados:rec, atualizado:rec.atualizado};
  const prev = queues.get(rec.id) || Promise.resolve();
  const p = prev.then(async ()=>{ const {error} = await sb.from("registros").upsert(linha,{onConflict:"user_id,id"}); if(error) throw error; })
    .catch(e=>{ console.error(e); toast("Não foi possível salvar. Verifique sua conexão e tente de novo."); });
  queues.set(rec.id,p); return p;
}
function delRec(id){
  recs.delete(id); scheduleRender();
  if (!sb || !uidAtual) return Promise.resolve();
  const prev = queues.get(id) || Promise.resolve();
  const p = prev.then(async ()=>{ const {error} = await sb.from("registros").delete().eq("user_id",uidAtual).eq("id",id); if(error) throw error; })
    .catch(e=>{ console.error(e); toast("Não foi possível excluir. Tente de novo."); });
  queues.set(id,p); return p;
}
const getRec = id => recs.has(id) ? clone(recs.get(id)) : null;
const byTipo = t => [...recs.values()].filter(r=>r.tipo===t);

/* ============ Categorias ============ */
const CAT_CORES = ["#d64545","#e8772e","#d4a106","#4c9a2a","#1f9254","#0d9488","#0891b2","#2563eb","#4f46e5","#7b3fe4","#c0367f","#8a6a4f","#6b7770"];
const CFG_ID = "cfg_categorias";
function catConfig(){
  const r = recs.get(CFG_ID); if (r) return r;
  return {id:CFG_ID, tipo:"config", pagar:CATS.pagar.map((n,i)=>({nome:n,cor:CAT_CORES[i%CAT_CORES.length]})), receber:CATS.receber.map((n,i)=>({nome:n,cor:CAT_CORES[(i+4)%CAT_CORES.length]}))};
}
function catList(nat){
  const list = (catConfig()[nat]||[]).slice(); const names = new Set(list.map(c=>c.nome));
  const used = [...byTipo("lanc").filter(r=>r.natureza===nat).map(r=>r.categoria), ...byTipo("contrato").filter(c=>MODS[c.modalidade]?.nat===nat).map(c=>c.categoria)].filter(Boolean);
  used.forEach(n=>{ if(!names.has(n)){ names.add(n); list.push({nome:n,cor:"#6b7770",avulsa:true}); } });
  return list;
}
function catColor(nome){ const cfg=catConfig(); const c=[...(cfg.pagar||[]),...(cfg.receber||[])].find(x=>x.nome===nome); return c?c.cor:"#6b7770"; }
function addCategoria(nat,nome){
  nome = String(nome||"").trim(); if(!nome) return;
  const cfg = clone(catConfig()); cfg[nat] = cfg[nat]||[];
  if (cfg[nat].some(c=>c.nome.toLowerCase()===nome.toLowerCase())) return;
  cfg[nat].push({nome, cor:CAT_CORES[cfg[nat].length%CAT_CORES.length]}); saveRec(cfg);
}
function catUso(nat,nome){
  const ls = byTipo("lanc").filter(r=>r.natureza===nat && (r.categoria||"Outros")===nome);
  const cs = byTipo("contrato").filter(c=>MODS[c.modalidade]?.nat===nat && c.categoria===nome);
  return {n:ls.length+cs.length, ls, cs, mes:sum(ls.filter(r=>inPer(r.vencimento)),r=>r.valor)};
}
function renomearCategoria(nat,antigo,novo,cor){
  const cfg = clone(catConfig()); cfg[nat]=cfg[nat]||[];
  const it = cfg[nat].find(c=>c.nome===antigo);
  if (it){ it.nome=novo; it.cor=cor; } else cfg[nat].push({nome:novo,cor});
  saveRec(cfg);
  if (antigo!==novo){ const u=catUso(nat,antigo); u.ls.forEach(r=>{const y=clone(r);y.categoria=novo;saveRec(y);}); u.cs.forEach(c=>{const y=clone(c);y.categoria=novo;saveRec(y);}); }
}
function excluirCategoria(nat,nome,destino){
  const cfg = clone(catConfig()); cfg[nat]=(cfg[nat]||[]).filter(c=>c.nome!==nome); saveRec(cfg);
  const u=catUso(nat,nome); u.ls.forEach(r=>{const y=clone(r);y.categoria=destino;saveRec(y);}); u.cs.forEach(c=>{const y=clone(c);y.categoria=destino||"";saveRec(y);});
}

/* ============ Regras de negócio ============ */
function taxaMensal(c){
  const t = Number(c.taxa)||0;
  if (!t) return 0;
  return c.taxaPeriodo==="aa" ? (Math.pow(1+t/100,1/12)-1)*100 : t;
}
function pmt(P,i,n){return i>0 ? P*i/(1-Math.pow(1+i,-n)) : P/n;}
function solveRate(P,parcela,n){ // taxa mensal (decimal) que gera a parcela informada, sistema Price
  if (!(P>0&&parcela>0&&n>0) || parcela*n<=P) return 0;
  let lo=0, hi=1;
  for(let k=0;k<100;k++){const mid=(lo+hi)/2; if (pmt(P,mid,n)>parcela) hi=mid; else lo=mid;}
  return (lo+hi)/2;
}
function principal(c){
  const fin = sum((c.taxas||[]).filter(t=>t.tipo==="financiada"),t=>t.valor);
  return Math.max(0,(Number(c.valorTotal)||0)-(Number(c.entrada)||0)+fin);
}
function gerarParcelas(c, antigas){
  const n = Math.max(1,Math.min(600,parseInt(c.nParcelas)||1));
  const P = principal(c);
  let i = taxaMensal(c)/100;
  if (!i && c.sistema==="price" && Number(c.parcelaInformada)>0){
    i = solveRate(P,Number(c.parcelaInformada),n);
    c.taxaCalculada = r2(i*100*10000)/10000;
  } else c.taxaCalculada = null;
  if (c.sistema==="sem") i = 0;
  const mensal = sum((c.taxas||[]).filter(t=>t.tipo==="mensal"),t=>t.valor);
  const avista = sum((c.taxas||[]).filter(t=>t.tipo==="avista"),t=>t.valor);
  const old = new Map((antigas||[]).map(p=>[p.n,p]));
  const jaPagas = parseInt(c.jaPagas)||0;
  const base = c.sistema==="price" ? pmt(P,i,n) : 0;
  let saldo = P; const rows=[];
  for(let k=1;k<=n;k++){
    const juros = r2(saldo*i);
    let amort = c.sistema==="sac"||c.sistema==="sem"||i===0 ? r2(P/n) : r2(base-juros);
    if (k===n) amort = r2(saldo);
    const extra = r2(mensal + (k===1?avista:0));
    saldo = r2(saldo-amort);
    const venc = addMonths(c.primeiroVenc||todayStr(),k-1);
    const o = old.get(k); const calc = r2(amort+juros+extra); const aj = !!(o&&o.ajustado);
    rows.push({n:k,venc:aj&&o.venc?o.venc:venc,vencCalc:venc,amort,juros,taxas:extra,valor:aj?r2(o.valor):calc,valorCalc:calc,ajustado:aj,obs:o&&o.obs||"",saldo:Math.max(0,saldo),
      pago:o?(!!o.pago||k<=jaPagas):k<=jaPagas, dataPag:o&&o.pago?o.dataPag||venc:(k<=jaPagas?venc:null)});
  }
  return rows;
}
function resumoContrato(c){
  const ps = c.parcelas||[];
  const pagas = ps.filter(p=>p.pago);
  const abertas = ps.filter(p=>!p.pago);
  const ultimaPaga = pagas.length ? Math.max(...pagas.map(p=>p.n)) : 0;
  const saldoDevedor = ultimaPaga ? (ps.find(p=>p.n===ultimaPaga)||{saldo:principal(c)}).saldo : principal(c);
  return {
    total:sum(ps,p=>p.valor), juros:sum(ps,p=>p.juros), taxas:sum(ps,p=>p.taxas),
    pago:sum(pagas,p=>p.valor), aberto:sum(abertas,p=>p.valor),
    nPagas:pagas.length, n:ps.length, saldoDevedor: abertas.length?saldoDevedor:0,
    proxima: abertas.sort((a,b)=>a.venc.localeCompare(b.venc))[0]||null,
    vencidas: abertas.filter(p=>p.venc<todayStr()).length,

function dreDados(meses){
  const real = ui.dreModo==="realizado"; const idx=new Map(meses.map((m,i)=>[m,i]));
  const G={receber:{},fixa:{},variavel:{}}; const nz=()=>meses.map(()=>0);
  allEntries().filter(e=>!e.fora).forEach(e=>{ const d = real ? (e.pago ? (e.dataPag||e.venc) : null) : e.venc; if(!d) return; const i=idx.get(d.slice(0,7)); if(i===undefined) return;
    const g = e.natureza==="receber" ? "receber" : (e.classe==="fixa" ? "fixa" : "variavel"); const c=e.categoria||"Outros";
    (G[g][c] ||= nz())[i] += e.valor; });
  const ord = o => Object.entries(o).sort((a,b)=>sum(b[1],x=>x)-sum(a[1],x=>x));
  const tot = o => meses.map((_,i)=>r2(sum(Object.values(o),a=>a[i])));
  const rec=tot(G.receber), fix=tot(G.fixa), vari=tot(G.variavel), desp=meses.map((_,i)=>r2(fix[i]+vari[i])), res=meses.map((_,i)=>r2(rec[i]-desp[i]));

}

function barChart(series){

  const ticks = 4; const gw = iw/series.length; const bw = Math.min(26,gw*0.3);
  let g="";
  for(let k=0;k<=ticks;k++){const v=nice*k/ticks;const y=T+ih-ih*v/nice;g+=`<line x1="${L}" x2="${W-Rr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="Plus Jakarta Sans,system-ui,sans-serif">${compact(v)}</text>`;}
  series.forEach((s,i)=>{const cx=L+gw*i+gw/2;const hr=ih*s.r/nice,hp=ih*s.p/nice;const cur=s.mk===ui.mes;
    g+=`<rect x="${cx-bw-2}" y="${T+ih-hr}" width="${bw}" height="${Math.max(0,hr)}" rx="3" fill="var(--c-receber)"><title>A receber ${money(s.r)}</title></rect>`;
    g+=`<rect x="${cx+2}" y="${T+ih-hp}" width="${bw}" height="${Math.max(0,hp)}" rx="3" fill="var(--c-pagar)"><title>A pagar ${money(s.p)}</title></rect>`;
    g+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="12" fill="${cur?"var(--fg)":"var(--muted)"}" font-weight="${cur?700:400}">${mesCurto(s.mk)}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de contas a pagar e a receber por mês">${g}</svg>`;
}

        : `<button class="icon-btn" data-act="edit-parcela" data-id="${e.id}" data-idx="${e.idx}" title="Editar parcela" aria-label="Editar parcela">✎</button><button class="icon-btn" data-act="open-contrato" data-id="${e.id}" data-mod="${e.origem}" title="Abrir contrato" aria-label="Abrir contrato">↗</button>`}</div></td></tr>${ab?`<tr class="rc-row"><td colspan="8">${isCard(lr)?cartaoCard(lr,e.key,e.key.startsWith("f|")):contaCard(lr,e.key)}</td></tr>`:""}`; }).join("")}

}

    <div class="row">${monthNav()}${pdfBtn()}<button class="btn pri" data-act="novo-contrato" data-mod="${mod}">+ ${rec?"Novo devedor":"Novo "+M.sing.toLowerCase()}</button></div></div>

    <div class="kpi" style="--kc:var(--warn)"><span class="l">Juros + taxas totais</span><span class="v">${money(sum(rs,r=>r.juros+r.taxas))}</span><span class="d">Juros ${money(sum(rs,r=>r.juros))}</span></div>
  </div>
  ${cs.length?(()=>{ const ps=cs.flatMap(c=>c.parcelas||[]).filter(p=>inPer(p.venc)); return `<div class="perbar"><span class="pb-l">Em ${perCurto()}</span><span><small>${rec?"Recebido":"Pago"}</small><b class="pos">${money(sum(ps.filter(p=>p.pago),p=>p.valor))}</b></span><span><small>${rec?"A receber":"A pagar"}</small><b>${money(sum(ps.filter(p=>!p.pago),p=>p.valor))}</b></span><span><small>Juros</small><b>${money(sum(ps,p=>p.juros))}</b></span><span><small>Amortização</small><b>${money(sum(ps,p=>p.amort))}</b></span><span><small>Parcelas</small><b>${ps.length}</b></span></div>`; })():""}
  ${mod==="devedor"&&cs.length?resumoDevedores(cs):""}
  ${cs.length?`<div class="cards">${cs.map((c,i)=>contratoCard(c,rs[i],M)).join("")}</div>`
   :`<div class="panel empty"><b>Nenhum registro em ${M.label.toLowerCase()}</b>Cadastre o valor, a taxa de juros, as taxas extras e a data da 1ª parcela. As parcelas são calculadas sozinhas.</div>`}`;
}
/* Devedores: quem, o quê e quanto me devem no período */
function resumoDevedores(cs){
  const ini = ui.per==="ano" ? ano()+"-01-01" : ui.mes+"-01";
  const linhas=[], atraso=[];
  cs.forEach(c=>(c.parcelas||[]).forEach((p,idx)=>{ const it={c,p,idx,key:`c:${c.id}:${idx}`,e:{pago:!!p.pago,venc:p.venc,natureza:"receber"}};
    if(inPer(p.venc)) linhas.push(it); else if(!p.pago && p.venc<ini) atraso.push(it); }));
  const ord=(a,b)=>a.p.venc.localeCompare(b.p.venc)||(a.c.parte||a.c.nome||"").localeCompare(b.c.parte||b.c.nome||"","pt-BR");
  linhas.sort(ord); atraso.sort(ord);
  const quem = it => esc(it.c.parte||it.c.nome||"—");
  const oque = it => `${esc(it.c.nome||"")}${it.c.objeto?`<small>${esc(it.c.objeto)}</small>`:""}`;
  const row = it => `<tr class="${it.p.pago?"is-pago":""}"><td class="desc">${quem(it)}</td><td class="desc">${oque(it)}</td><td>${it.p.n}/${(it.c.parcelas||[]).length}</td><td>${dt(it.p.venc)}</td><td class="r num">${money(it.p.valor)}</td><td>${pill(it.e)}</td>
    <td><div class="acts"><button class="pay ${it.p.pago?"done":""}" data-act="pago" data-key="${it.key}">${it.p.pago?"✓ Recebido":"Receber"}</button></div></td></tr>`;
  // por pessoa
  const pp=new Map(); linhas.forEach(it=>{ const k=it.c.parte||it.c.nome||"—"; const o=pp.get(k)||{t:0,a:0,n:0}; o.t+=it.p.valor; if(!it.p.pago) o.a+=it.p.valor; o.n++; pp.set(k,o); });
  atraso.forEach(it=>{ const k=it.c.parte||it.c.nome||"—"; const o=pp.get(k)||{t:0,a:0,n:0}; o.atr=(o.atr||0)+it.p.valor; pp.set(k,o); });
  const pessoas=[...pp.entries()].sort((a,b)=>(b[1].a+(b[1].atr||0))-(a[1].a+(a[1].atr||0)));
  const tot=sum(linhas,it=>it.p.valor), aberto=sum(linhas.filter(it=>!it.p.pago),it=>it.p.valor), atr=sum(atraso,it=>it.p.valor);
  const head=`<thead><tr><th>Quem</th><th>O quê</th><th>Parcela</th><th>Vencimento</th><th class="r">Valor</th><th>Status</th><th></th></tr></thead>`;
  return `<div class="panel" style="--mc:var(--c-devedor)"><h3>Quem me deve · ${perCurto()}</h3>
    ${pessoas.length?`<div class="list" style="margin-bottom:10px">${pessoas.map(([k,o])=>`<div class="li"><span class="dd sm" style="color:var(--c-devedor);font-weight:800">${o.n||0}×</span><span class="nm">${esc(k)}<small>${o.n?`${money(o.t)} no período${o.t-o.a>0.004?` · recebido ${money(o.t-o.a)}`:""}`:"nada no período"}${o.atr?` · <b class="neg">${money(o.atr)} em atraso</b>`:""}</small></span><span class="num" style="font-weight:800">${money(o.a+(o.atr||0))}</span></div>`).join("")}</div>`:""}
    ${pessoas.length?`<p class="note" style="margin:0">Total ${perDe()}: ${money(tot)} · em aberto ${money(aberto)}${atr?` · <b class="neg">${money(atr)} em atraso de períodos anteriores</b>`:""}. Os detalhes de cada parcela ficam em “Ver parcelas”, no card de cada devedor.</p>`:`<p class="note" style="margin:0">Nenhuma parcela a receber em ${perCurto()}.</p>`}
  </div>`;
}

    <div class="facts">

function invSpark(v){
  const pts=invSerie(v); if(pts.length<2) return `<span class="note">—</span>`;
  const W=90,H=28; const x0=dms(pts[0].d), x1=Math.max(x0+1,dms(pts[pts.length-1].d)); const vs=pts.map(p=>p.s); const lo=Math.min(...vs), hi=Math.max(...vs); const sp=hi-lo||1;
  const d=pts.map((p,i)=>`${i?"L":"M"}${((dms(p.d)-x0)/(x1-x0)*W).toFixed(1)},${(H-3-(p.s-lo)/sp*(H-6)).toFixed(1)}`).join(" ");
  const up = pts[pts.length-1].s>=pts[0].l;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${d}" fill="none" stroke="var(${up?"--ok":"--bad"})" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
}

  const ult = (()=>{ const ds=[...(v.atualizacoes||[]),...mv.filter(m=>m.tipo==="rendimento"||m.tipo==="perda").map(m=>m.data)].sort(); return ds.length?{data:ds[ds.length-1]}:null; })();

      <div class="ir-c" data-l="Valor inicial">${money(movInicial(v)?.valor||0)}</div>
      <div class="ir-c" data-l="Aportes">${money(r.ap-(movInicial(v)?.valor||0))}<small>${(v.movimentos||[]).filter(m=>m.tipo==="aporte").length-(movInicial(v)?1:0)} aporte(s)</small></div>
      <div class="ir-c" data-l="Total investido">${money(r.ap)}${r.rs?`<small>resgatado ${money(r.rs)}</small>`:""}</div>
      <div class="ir-c strong" data-l="Valor atual">${money(r.saldo)}<small>${ult?"em "+dt(ult.data).slice(0,6)+dt(ult.data).slice(8):"sem atualização"}</small></div>
      <div class="ir-c" data-l="Rentabilidade"><span class="${g?"pos":"neg"} gain">${g?"+":""}${money(r.ganho)}</span><small class="${g?"pos":"neg"}">${r.ap?(g?"+":"")+pctf(r.pct):"—"}</small></div>

/* ============ Registro de atualizações (cada data em que o valor atual foi informado) ============ */
function regDatas(v){
  const mv=v.movimentos||[]; const ds=new Set(v.atualizacoes||[]);
  mv.filter(m=>m.tipo==="rendimento"||m.tipo==="perda").forEach(m=>ds.add(m.data));
  const ini=movInicial(v); if(ini) ds.add(ini.data); else if(mv.length) ds.add(mv.slice().sort((a,b)=>a.data.localeCompare(b.data))[0].data);
  return [...ds].filter(Boolean).sort();
}
function estadoEm(v,d){ let s=0,l=0,res=0,ok=false; for(const m of v.movimentos||[]){ if(!m.data||m.data>d) continue; ok=true;
  if(m.tipo==="aporte"){s+=m.valor;l+=m.valor;} else if(m.tipo==="resgate"){s-=m.valor;l-=m.valor;} else if(m.tipo==="rendimento"){s+=m.valor;res+=m.valor;} else {s-=m.valor;res-=m.valor;} }
  return ok?{s:r2(s),l:r2(l),res:r2(res)}:null; }
function regPontos(lista){
  const ds=[...new Set(lista.flatMap(regDatas))].sort();
  return ds.map(d=>{ let s=0,l=0,res=0,n=0; lista.forEach(v=>{ const e=estadoEm(v,d); if(e){s+=e.s;l+=e.l;res+=e.res;n++;} }); return {d,s:r2(s),l:r2(l),res:r2(res),n,atual:lista.some(v=>(v.atualizacoes||[]).includes(d)||(v.movimentos||[]).some(m=>m.data===d&&(m.tipo==="rendimento"||m.tipo==="perda")))}; });
}
const REG_PER=[["1m","Último mês"],["3m","Últimos 3 meses"],["6m","Últimos 6 meses"],["12m","Últimos 12 meses"],["ano","Ano selecionado"],["tudo","Tudo"],["custom","Escolher datas…"]];
function regFaixa(){
  const t=todayStr(), p=ui.regPer||"6m";
  if(p==="tudo") return ["0000-01-01","9999-12-31"];
  if(p==="ano") return [ano()+"-01-01",ano()+"-12-31"];
  if(p==="custom") return [ui.regDe||addMonths(t,-6), ui.regAte||t];
  return [addMonths(t,-({"1m":1,"3m":3,"6m":6,"12m":12}[p]||6)), t];
}
function regPainel(lista,uidc){
  const todos=regPontos(lista); const [de,ate]=regFaixa();
  const pts=todos.filter(p=>p.d>=de&&p.d<=ate);

    ${(ui.regPer||"6m")==="custom"?`<input type="date" class="regde" value="${de}" aria-label="De"><span class="note">até</span><input type="date" class="regate" value="${ate}" aria-label="Até">`:""}</div>`;
  if(!pts.length) return `${sel}<p class="note" style="margin:10px 0 0">Nenhuma atualização registrada nesse período. Use <b>Atualizar</b> para registrar o valor atual do dia.</p>`;
  const prim=pts[0], ult=pts[pts.length-1]; const varP=r2(ult.res-(todos[todos.indexOf(prim)-1]?.res ?? 0));
  const ganhoP = todos.indexOf(prim)>0 ? r2(ult.res-todos[todos.indexOf(prim)-1].res) : ult.res;
  const rows=pts.map((p,i)=>{ const ant=todos[todos.indexOf(p)-1]; const dv=ant?r2(p.res-ant.res):p.res; return {p,dv}; }).reverse();
  return `${sel}
    <div class="perbar" style="--mc:var(--c-invest);margin-top:12px"><span class="pb-l">${dt(prim.d)} → ${dt(ult.d)}</span><span><small>Registros</small><b>${pts.length}</b></span><span><small>Valor no último registro</small><b>${money(ult.s)}</b></span><span><small>Total investido</small><b>${money(ult.l)}</b></span><span><small>Resultado no período</small><b class="${ganhoP>=0?"pos":"neg"}">${ganhoP>=0?"+":""}${money(ganhoP)}</b></span><span><small>Resultado acumulado</small><b class="${ult.res>=0?"pos":"neg"}">${ult.res>=0?"+":""}${money(ult.res)}</b></span></div>
    <div class="ichart" style="margin-top:12px"><div class="row" style="justify-content:space-between"><h5>Valor em cada atualização</h5><div class="legend" style="margin:0"><span><i style="background:var(--c-invest)"></i>Valor atual</span><span><i class="dash"></i>Total investido</span></div></div>
      ${pts.length>1?invLineChart(pts,"rg"+uidc,true):`<p class="note" style="margin:0">Com 2 ou mais atualizações no período o gráfico aparece aqui.</p>`}</div>
    <div class="tw" style="margin-top:12px"><table style="min-width:720px"><thead><tr><th>Data</th><th class="r">Valor atual</th><th class="r">Variação desde o registro anterior</th><th class="r">Total investido</th><th class="r">Resultado acumulado</th><th class="r">Rentab.</th></tr></thead><tbody>

    </tbody></table></div>`;

/* ============ Histórico mensal (fechamento de cada mês) ============ */
function histMensal(movs){
  const mv=(movs||[]).filter(m=>m&&m.data).slice().sort((a,b)=>a.data.localeCompare(b.data)); if(!mv.length) return [];
  const hoje=todayStr().slice(0,7); let mk=mv[0].data.slice(0,7); const fim = mv[mv.length-1].data.slice(0,7)>hoje ? mv[mv.length-1].data.slice(0,7) : hoje;
  const out=[]; let ap=0,rs=0,res=0,i=0;
  while(mk<=fim){
    let apM=0,rsM=0,resM=0;
    while(i<mv.length && mv[i].data.slice(0,7)===mk){ const m=mv[i++]; if(m.tipo==="aporte") apM+=m.valor; else if(m.tipo==="resgate") rsM+=m.valor; else if(m.tipo==="rendimento") resM+=m.valor; else resM-=m.valor; }
    ap+=apM; rs+=rsM; res+=resM;
    out.push({mk, apM:r2(apM), rsM:r2(rsM), resM:r2(resM), ap:r2(ap), rs:r2(rs), res:r2(res), saldo:r2(ap-rs+res), pct: ap>0? res/ap*100 : 0, parcial: mk===hoje});
    mk=shiftMonth(mk,1);
  }
  return out;
}
function histTabela(movs){
  let h=histMensal(movs); if(ui.per==="ano") h=h.filter(x=>x.mk.slice(0,4)===ano());
  if(!h.length) return `<p class="note" style="margin:0">Sem movimentos ${ui.per==="ano"?"em "+ano():"ainda"}.</p>`;
  const temRs=h.some(x=>x.rs>0);
  return `<div class="tw"><table style="min-width:${temRs?860:760}px"><thead><tr><th>Fim do mês</th><th class="r">Aportes no mês</th>${temRs?`<th class="r">Resgates no mês</th>`:""}<th class="r">Total aportado</th><th class="r">Resultado no mês</th><th class="r">Resultado acumulado</th><th class="r">Valor no fim do mês</th><th class="r">Rentab.</th></tr></thead><tbody>
    ${h.slice().reverse().map(x=>`<tr${x.mk===ui.mes?' style="background:color-mix(in srgb,var(--c-invest) 7%,transparent)"':""}><td style="text-transform:capitalize;font-weight:600">${mesNome(x.mk)}${x.parcial?` <span class="note" style="text-transform:none">(até hoje)</span>`:""}</td>
      <td class="r num">${x.apM?money(x.apM):'<span class="note">—</span>'}</td>${temRs?`<td class="r num">${x.rsM?"− "+money(x.rsM):'<span class="note">—</span>'}</td>`:""}<td class="r num">${money(x.ap)}</td>
      <td class="r num ${x.resM>0?"pos":x.resM<0?"neg":""}">${x.resM?(x.resM>0?"+ ":"− ")+money(Math.abs(x.resM)):'<span class="note">—</span>'}</td>
      <td class="r num ${x.res>=0?"pos":"neg"}">${x.res>=0?"+ ":"− "}${money(Math.abs(x.res))}</td><td class="r num" style="font-weight:700">${money(x.saldo)}</td><td class="r num ${x.res>=0?"pos":"neg"}">${x.ap?(x.res>=0?"+":"")+pctf(x.pct):"—"}</td></tr>`).join("")}
  </tbody></table></div>`;
}

/* ============ Painel do investimento ============ */
function invSerie(v){
  const mv=(v.movimentos||[]).slice().sort((a,b)=>a.data.localeCompare(b.data));
  const pts=[]; let s=0,l=0;
  for(const m of mv){
    if(m.tipo==="aporte"){s+=m.valor;l+=m.valor;} else if(m.tipo==="resgate"){s-=m.valor;l-=m.valor;} else if(m.tipo==="rendimento") s+=m.valor; else s-=m.valor;
    const last=pts[pts.length-1];
    if(last&&last.d===m.data){last.s=r2(s);last.l=r2(l);} else pts.push({d:m.data,s:r2(s),l:r2(l)});
  }
  const t=todayStr(); if(pts.length && pts[pts.length-1].d<t) pts.push({d:t,s:pts[pts.length-1].s,l:pts[pts.length-1].l,hoje:true});
  return pts;
}
const dms = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d).getTime(); };
function monthsBetween(a,b){ return Math.max(0,(dms(b)-dms(a))/(1000*60*60*24*30.4375)); }
function niceMax(v){ if(v<=0) return 1; const st=Math.pow(10,Math.floor(Math.log10(v))); const f=v/st; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*st; }
function invLineChart(pts,uidc,zoom){
  const W=640,H=250,L=zoom?84:70,R=14,T=14,B=30; const iw=W-L-R, ih=H-T-B;
  const x0=dms(pts[0].d), x1=Math.max(x0+864e5,dms(pts[pts.length-1].d));
  let vmin=0, vmax=niceMax(Math.max(...pts.map(p=>Math.max(p.s,p.l)))*1.05);
  if(zoom){ const vs=pts.flatMap(p=>[p.s,p.l]); const lo=Math.min(...vs), hi=Math.max(...vs); const pd=(hi-lo)*0.15||Math.max(1,hi*0.01); vmin=Math.max(0,lo-pd); vmax=hi+pd; }
  const rng=vmax-vmin; const fx=v=> zoom&&rng<20000 ? "R$ "+Math.round(v).toLocaleString("pt-BR") : compact(v);
  const X=d=>L+(dms(d)-x0)/(x1-x0)*iw, Y=v=>T+ih-((Math.max(vmin,v)-vmin)/rng)*ih;
  let g="";
  for(let k=0;k<=4;k++){const v=vmin+rng*k/4,y=Y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="12.5" fill="var(--muted)">${fx(v)}</text>`;}
  const nT=Math.min(5,pts.length); for(let k=0;k<nT;k++){const t=x0+(x1-x0)*(nT===1?0:k/(nT-1));const d=new Date(t);const x=L+(t-x0)/(x1-x0)*iw;
    g+=`<text x="${x}" y="${H-8}" text-anchor="${k===0?"start":k===nT-1?"end":"middle"}" font-size="12.5" fill="var(--muted)">${MES_AB[d.getMonth()]}/${String(d.getFullYear()).slice(2)}</text>`;}
  // investido líquido em degraus
  let stp=`M${X(pts[0].d)},${Y(pts[0].l)}`; for(let i=1;i<pts.length;i++){stp+=` H${X(pts[i].d)} V${Y(pts[i].l)}`;}
  const line=pts.map((p,i)=>`${i?"L":"M"}${X(p.d).toFixed(1)},${Y(p.s).toFixed(1)}`).join(" ");
  const area=`${line} L${X(pts[pts.length-1].d).toFixed(1)},${T+ih} L${X(pts[0].d).toFixed(1)},${T+ih} Z`;
  g+=`<defs><linearGradient id="gr-${uidc}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--c-invest)" stop-opacity=".28"/><stop offset="1" stop-color="var(--c-invest)" stop-opacity="0"/></linearGradient></defs>`;
  g+=`<path d="${area}" fill="url(#gr-${uidc})"/>`;
  g+=`<path d="${stp}" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="5 4"/>`;
  g+=`<path d="${line}" fill="none" stroke="var(--c-invest)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p,i)=>{ const last=i===pts.length-1; g+=`<circle cx="${X(p.d).toFixed(1)}" cy="${Y(p.s).toFixed(1)}" r="${last?5:3.2}" fill="${last?"var(--c-invest)":"var(--surface)"}" stroke="var(--c-invest)" stroke-width="2"><title>${dt(p.d)} · saldo ${money(p.s)} · investido ${money(p.l)}</title></circle>`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução do saldo do investimento">${g}</svg>`;
}
function invMonthBars(mv){
  const res={}; mv.filter(m=>m.tipo==="rendimento"||m.tipo==="perda").forEach(m=>{const k=m.data.slice(0,7);res[k]=(res[k]||0)+(m.tipo==="rendimento"?m.valor:-m.valor);});
  const keys=Object.keys(res).sort(); if(!keys.length) return "";
  const months=[]; let k=keys[0]; const last=keys[keys.length-1]; while(k<=last&&months.length<60){months.push(k);k=shiftMonth(k,1);}
  const show=months.slice(-12);
  const W=700,H=170,L=70,R=14,T=12,B=26; const iw=W-L-R, ih=H-T-B;
  const mx=niceMax(Math.max(1,...show.map(m=>Math.abs(res[m]||0)))); const hasNeg=show.some(m=>(res[m]||0)<0);
  const zero = hasNeg ? T+ih/2 : T+ih; const sc = hasNeg ? ih/2/mx : ih/mx;
  const gw=iw/show.length, bw=Math.min(30,gw*.6); let g="";
  g+=`<line x1="${L}" x2="${W-R}" y1="${zero}" y2="${zero}" stroke="var(--line)"/><text x="${L-8}" y="${zero+4}" text-anchor="end" font-size="12.5" fill="var(--muted)">R$ 0</text><text x="${L-8}" y="${T+8}" text-anchor="end" font-size="12.5" fill="var(--muted)">${compact(mx)}</text>`;
  show.forEach((m,i)=>{const v=res[m]||0;const h=Math.abs(v)*sc;const x=L+gw*i+(gw-bw)/2;
    g+=`<rect x="${x}" y="${v>=0?zero-h:zero}" width="${bw}" height="${Math.max(v?1.5:0,h)}" rx="3" fill="${v>=0?"var(--ok)":"var(--bad)"}"><title>${mesCurto(m)}: ${v>=0?"+":""}${money(v)}</title></rect>`;
    if(show.length<=12) g+=`<text x="${x+bw/2}" y="${H-7}" text-anchor="middle" font-size="12" fill="var(--muted)">${mesCurto(m)}</text>`;});
  return {svg:`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Resultado mensal">${g}</svg>`, res, months};
}
function invDash(v,r){
  const pts=invSerie(v); const mv=v.movimentos||[];
  if(!pts.length) return `<div class="preview"><span class="note">Registre o primeiro aporte para ver a evolução.</span></div>`;
  const inicio = v.dataInicio && v.dataInicio<pts[0].d ? v.dataInicio : pts[0].d;
  const ultAval = mv.filter(m=>m.tipo==="rendimento"||m.tipo==="perda").map(m=>m.data).sort().pop() || todayStr();
  const meses = monthsBetween(inicio, ultAval>inicio?ultAval:todayStr());
  const base = r.ap>0 ? r.ap : 0;
  const mensal = base && meses>=1 ? (Math.pow(Math.max(0.0001,1+r.ganho/base),1/meses)-1)*100 : null;
  const anual = mensal!==null ? (Math.pow(1+mensal/100,12)-1)*100 : null;
  const total = sum(byTipo("invest").map(invResumo),x=>x.saldo);
  const mb = invMonthBars(mv);
  let melhor=null,pior=null; if(mb){ for(const m of mb.months){const x=mb.res[m]; if(x===undefined) continue; if(!melhor||x>mb.res[melhor]) melhor=m; if(!pior||x<mb.res[pior]) pior=m;} }
  const g=r.ganho>=0;
  return `<div class="idash">
    <div class="ichart"><div class="row" style="justify-content:space-between"><h5>Evolução do saldo</h5><div class="legend" style="margin:0"><span><i style="background:var(--c-invest)"></i>Saldo</span><span><i class="dash"></i>Valor investido</span></div></div>
      ${pts.length>1?invLineChart(pts,v.id):`<p class="note">Atualize o saldo ou registre rendimentos para desenhar a curva.</p>`}</div>
    <div class="istats">
      <div class="ist"><span>Resultado</span><b class="${g?"pos":"neg"}">${g?"+":""}${money(r.ganho)}</b><small>${base?(g?"+":"")+pctf(r.pct):"—"} sobre o aportado</small></div>
      <div class="ist"><span>Rentabilidade média</span><b>${mensal===null?"—":pctf(mensal)+" a.m."}</b><small>${anual===null?"Precisa de 1 mês de histórico":"≈ "+pctf(anual)+" ao ano"}</small></div>
      <div class="ist"><span>Valor investido hoje</span><b>${money(r.liquido)}</b><small>Aportes ${money(r.ap)} − resgates ${money(r.rs)}</small></div>
      <div class="ist"><span>Tempo investido</span><b>${meses<1?Math.max(0,Math.round(meses*30))+" dias":Math.floor(meses)+" mes"+(Math.floor(meses)===1?"":"es")}</b><small>Desde ${dt(inicio)}</small></div>
      <div class="ist"><span>Peso na carteira</span><b>${total>0?pctf(r.saldo/total*100,1):"—"}</b><div class="bar" style="--mc:var(--c-invest)"><span style="width:${total>0?Math.min(100,r.saldo/total*100):0}%"></span></div></div>
    </div>
    ${mb?`<div class="ichart wide2"><div class="row" style="justify-content:space-between"><h5>Resultado por mês</h5><span class="note">${melhor?`Melhor: ${mesCurto(melhor)} (${money(mb.res[melhor])})`:""}${pior&&pior!==melhor?` · Pior: ${mesCurto(pior)} (${money(mb.res[pior])})`:""}</span></div>${mb.svg}</div>`:""}
  </div>`;
}

/* ============ Categorias ============ */
/* Gráficos de distribuição: barras ou pizza (escolha lembrada por gráfico) */
const grafTipo = id => ui.graf?.[id] || (id==="origem"||id==="cat" ? "pizza" : "barras");
function grafHead(titulo,id,tem){

}
function distChart(id,itens){

}
function pizzaChart(itens){
  const tot=sum(itens,i=>i.valor)||1, R=84, r=50, c=90; let a=-Math.PI/2;
  const pt=(ang,rad)=>`${(c+rad*Math.cos(ang)).toFixed(2)} ${(c+rad*Math.sin(ang)).toFixed(2)}`;
  const segs=itens.map(i=>{ const f=i.valor/tot; const tt=`<title>${esc(i.nome)}: ${money(i.valor)} (${pctf(f*100,1)})</title>`;
    if(f>=0.9999) return `<circle cx="${c}" cy="${c}" r="${(R+r)/2}" fill="none" stroke="${i.cor}" stroke-width="${R-r}">${tt}</circle>`;
    const b=a+f*2*Math.PI, lg=f>0.5?1:0; const d=`M${pt(a,R)}A${R} ${R} 0 ${lg} 1 ${pt(b,R)}L${pt(b,r)}A${r} ${r} 0 ${lg} 0 ${pt(a,r)}Z`; a=b;
    return `<path d="${d}" style="fill:${i.cor}" stroke="var(--surface)" stroke-width="1.5">${tt}</path>`; }).join("");
  return `<div class="pie"><svg viewBox="0 0 180 180" role="img" aria-label="Gráfico de pizza">${segs}<text x="90" y="85" text-anchor="middle" class="pt">Total</text><text x="90" y="103" text-anchor="middle" class="pv">${money(tot)}</text></svg>
    <div class="pleg">${itens.map(i=>`<div><i style="background:${i.cor}"></i><span title="${esc(i.nome)}">${esc(i.nome)}</span><b>${pctf(i.valor/tot*100,1)}</b><small>${money(i.valor)}</small></div>`).join("")}</div></div>`;
}

function formParcela(id,idx){
  const c=getRec(id); if(!c) return; const M=MODS[c.modalidade]; const p=c.parcelas[+idx]; if(!p) return; const rec=M.nat==="receber";
  const seguintes = c.parcelas.filter((x,i)=>i>+idx && !x.pago).length;
  openModal({title:`${esc(c.nome)} · parcela ${p.n}/${c.parcelas.length}`, color:`--c-${c.modalidade}`,
    body:`<div class="preview"><div class="facts">
      <div class="fact"><div class="l">Valor calculado</div><div class="v">${money(p.valorCalc??p.valor)}</div></div>
      <div class="fact"><div class="l">Amortização</div><div class="v">${money(p.amort)}</div></div>
      <div class="fact"><div class="l">Juros</div><div class="v">${money(p.juros)}</div></div>
      <div class="fact"><div class="l">Taxas</div><div class="v">${money(p.taxas)}</div></div></div></div>
    <div class="fg">${fld("pv_valor","Valor da parcela (R$)",moneyInp("pv_valor",p.valor),"Ajuste para o valor do boleto/extrato.")}${fld("pv_venc","Vencimento",inp("pv_venc",p.venc,'type="date"'))}</div>
    ${seguintes?`<label class="chk"><input type="checkbox" name="pv_seguintes"> Aplicar este valor também às ${seguintes} parcela(s) seguintes em aberto</label>`:""}
    <div class="fg">${fld("pv_obs","Observação",inp("pv_obs",p.obs,'placeholder="Ex.: reajuste anual, desconto por antecipação" autocomplete="off"'))}</div>
    <label class="chk"><input type="checkbox" name="pv_pago" ${p.pago?"checked":""}> ${rec?"Recebida":"Paga"}</label>
    <div class="fg">${fld("pv_dpag",rec?"Data do recebimento":"Data do pagamento",inp("pv_dpag",p.dataPag||todayStr(),'type="date"'))}</div>`,
    extraButtons: p.ajustado?`<button type="button" class="btn ghost" data-act="parc-restaurar" data-id="${c.id}" data-idx="${idx}">Restaurar valor calculado</button>`:"",
    onSubmit: fd => {
      const val=r2(parseMoney(fd.get("pv_valor"))); if(!(val>0)){toast("Informe um valor maior que zero.");return;}
      const aplicar = (q,i) => { const venc = i===+idx ? (fd.get("pv_venc")||q.venc) : q.venc;
        q.valor=val; q.venc=venc; q.ajustado = Math.abs(val-(q.valorCalc??val))>0.004 || venc!==(q.vencCalc||venc); };
      aplicar(p,+idx); p.obs=fd.get("pv_obs")||"";
      p.pago=!!fd.get("pv_pago"); p.dataPag=p.pago?(fd.get("pv_dpag")||todayStr()):null;
      if(fd.get("pv_seguintes")) c.parcelas.forEach((q,i)=>{ if(i>+idx && !q.pago) aplicar(q,i); });
      saveRec(c); toast(fd.get("pv_seguintes")?"Parcelas ajustadas.":"Parcela atualizada."); closeModal();
    }});
}
function restaurarParcela(id,idx){
  const c=getRec(id); if(!c) return; const p=c.parcelas[+idx]; p.ajustado=false;
  c.parcelas = gerarParcelas(c,c.parcelas); saveRec(c); toast("Valor calculado restaurado.");
}

/* ============ Fluxo de caixa ============ */
const FX_ID = "cfg_fluxo";
const fluxoCfg = () => recs.get(FX_ID) || {id:FX_ID, tipo:"config", saldos:{}};
function fluxoDados(ini,n,modo){
  const months=[...Array(n)].map((_,i)=>shiftMonth(ini,i));
  const cats={receber:{},pagar:{}}; const tot=months.map(()=>({ent:0,sai:0}));
  for(const e of allEntries()){
    if(e.fora) continue; /* só lembrete */
    const m = modo==="realizado" ? (e.pago ? (e.dataPag||e.venc).slice(0,7) : null) : e.venc.slice(0,7);
    const i = m ? months.indexOf(m) : -1; if(i<0) continue;
    const c = e.categoria||"Outros"; (cats[e.natureza][c] ||= months.map(()=>0))[i] += e.valor;
    if(e.natureza==="receber") tot[i].ent+=e.valor; else tot[i].sai+=e.valor;
  }
  const saldoIni = Number(fluxoCfg().saldos?.[ini])||0;
  let acc=saldoIni;
  const rows = months.map((m,i)=>{ const res=r2(tot[i].ent-tot[i].sai); const inicio=r2(acc); acc=r2(acc+res); return {m,ent:r2(tot[i].ent),sai:r2(tot[i].sai),res,inicio,fim:acc}; });
  return {months,cats,rows,saldoIni};
}
function fluxoChart(rows, lab=mesCurto, curKey=todayStr().slice(0,7)){
  const W=900,H=280,L=78,R=16,T=16,B=30; const iw=W-L-R, ih=H-T-B;
  const vals = rows.flatMap(r=>[r.ent,r.sai,r.fim]);
  let hi = niceMax(Math.max(1,...vals)); let lo = Math.min(0,...rows.map(r=>r.fim)); if(lo<0) lo = -niceMax(-lo);
  const Y = v => T + (hi-v)/(hi-lo)*ih;
  const gw = iw/rows.length, bw = Math.min(22, gw*.28);
  let g="";
  for(let k=0;k<=4;k++){ const v=lo+(hi-lo)*k/4, y=Y(v); g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="12" fill="var(--muted)">${compact(v)}</text>`; }
  if(lo<0) g+=`<line x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--muted)" stroke-width="1.2"/>`;
  rows.forEach((r,i)=>{ const cx=L+gw*i+gw/2, cur=r.m===curKey;
    if(cur) g+=`<rect x="${L+gw*i+2}" y="${T}" width="${gw-4}" height="${ih}" rx="8" fill="var(--surface-2)"/>`;
    g+=`<rect x="${cx-bw-2}" y="${Y(r.ent)}" width="${bw}" height="${Math.max(0,Y(0)-Y(r.ent))}" rx="3" fill="var(--c-receber)"><title>${lab(r.m)} · entradas ${money(r.ent)}</title></rect>`;
    g+=`<rect x="${cx+2}" y="${Y(r.sai)}" width="${bw}" height="${Math.max(0,Y(0)-Y(r.sai))}" rx="3" fill="var(--c-pagar)"><title>${lab(r.m)} · saídas ${money(r.sai)}</title></rect>`;
    g+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="12" fill="${cur?"var(--fg)":"var(--muted)"}" font-weight="${cur?700:400}">${(rows.length<=16||i%2===0||cur)?lab(r.m):""}</text>`; });
  const pts = rows.map((r,i)=>[L+gw*i+gw/2, Y(r.fim)]);
  g+=`<path d="${pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")}" fill="none" stroke="var(--c-fluxo)" stroke-width="2.6" stroke-linejoin="round"/>`;
  rows.forEach((r,i)=>{ g+=`<circle cx="${pts[i][0].toFixed(1)}" cy="${pts[i][1].toFixed(1)}" r="4" fill="${r.fim<0?"var(--bad)":"var(--c-fluxo)"}" stroke="var(--surface)" stroke-width="2"><title>${lab(r.m)} · saldo ${money(r.fim)}</title></circle>`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Entradas, saídas e saldo acumulado por mês">${g}</svg>`;
}

const CARDS_ID = "cfg_cartoes";
const BANDEIRAS = ["Visa","Mastercard","Elo","American Express","Hipercard","Outra"];
const CARD_CORES = ["#7b3fe4","#111827","#0e7490","#c0367f","#d97706","#1f9254","#2563eb","#b91c1c"];
const cardsCfg = () => recs.get(CARDS_ID) || {id:CARDS_ID, tipo:"config", cartoes:[]};
const cartoes = () => (cardsCfg().cartoes||[]);
const cardOf = r => r.cartaoId ? cartoes().find(c=>c.id===r.cartaoId) : cartoes().find(c=>c.nome===r.cartao);
const cardKey = r => { const c=cardOf(r); return c ? c.id : "n:"+(r.cartao||"Cartão"); };
const cardLabel = c => c ? `${c.nome}${c.final?" ••"+c.final:""}` : "";
const cardNameOf = r => { const c=cardOf(r); return c ? cardLabel(c) : (r.cartao||"Cartão"); };
const isCard = r => r.forma==="Cartão de crédito";
function dayIn(ym,d){ const [y,m]=ym.split("-").map(Number); const last=new Date(y,m,0).getDate(); return `${ym}-${pad(Math.min(Math.max(1,d),last))}`; }
function faturaVenc(card,dataCompra){
  if(!card||!dataCompra) return null;
  const F=+card.fechamento||1, V=+card.vencimento||10, d=+dataCompra.slice(8,10);
  const closeYm = d < F ? dataCompra.slice(0,7) : shiftMonth(dataCompra.slice(0,7),1);
  return dayIn(V > F ? closeYm : shiftMonth(closeYm,1), V);
}
const FREQS = [["mensal","Mensal"],["quinzenal","Quinzenal"],["semanal","Semanal"],["bimestral","Bimestral"],["trimestral","Trimestral"],["semestral","Semestral"],["anual","Anual"]];
const freqNome = f => (FREQS.find(x=>x[0]===f)||[,"Mensal"])[1];
function addFreq(d,k,f){ switch(f){ case "semanal": return addDays(d,7*k); case "quinzenal": return addDays(d,14*k); case "bimestral": return addMonths(d,2*k); case "trimestral": return addMonths(d,3*k); case "semestral": return addMonths(d,6*k); case "anual": return addMonths(d,12*k); default: return addMonths(d,k); } }
const condTxt = r => r.cond==="recorrente" ? `Recorrente ${freqNome(r.freq).toLowerCase()} · ${r.parcela}/${r.totalParcelas}` : (r.totalParcelas>1 ? `Parcela ${r.parcela}/${r.totalParcelas}` : "À vista");
function condBlock(pref, opts={}){ // campos de condição de pagamento
  const c = opts.cond||"avista";
  return `<div class="f"><span class="lb">Condição de pagamento</span>${seg("cond",[["avista","À vista"],["parcelado","Parcelado"],["recorrente","Recorrente"]],c)}</div>
    <div class="fg cond-parc" ${c==="parcelado"?"":"hidden"}>${fld("nParc","Nº de parcelas",inp("nParc",opts.n||2,'type="number" min="2" max="120"'))}${opts.semModo?"":fld("modoValor","O valor informado é",selInp("modoValor",[["total","Valor total (divide nas parcelas)"],["parcela","Valor de cada parcela"]],opts.modo||"total"))}</div>
    <div class="fg cond-rec" ${c==="recorrente"?"":"hidden"}>${fld("freq","Frequência",selInp("freq",FREQS,opts.freq||"mensal"))}${fld("nRec","Quantas vezes lançar",inp("nRec",opts.nRec||12,'type="number" min="2" max="120"'),"Ex.: 12 mensais = um ano. Depois é só lançar de novo.")}</div>`;
}
function condShow(fd){ const c=fd.get("cond"); const p=document.querySelector("#mform .cond-parc"), r=document.querySelector("#mform .cond-rec"); if(p) p.hidden=c!=="parcelado"; if(r) r.hidden=c!=="recorrente"; }
function condPlan(fd,valor,data,stepFn){ // devolve [{valor,data,k,n}]
  const c=fd.get("cond")||"avista";
  if(c==="parcelado"){ const n=Math.max(2,Math.min(120,parseInt(fd.get("nParc"))||2)); const porParc = fd.get("modoValor")==="parcela";
    const cada = porParc ? valor : Math.floor(valor/n*100)/100; const resto = porParc ? 0 : r2(valor-cada*n);
    return [...Array(n)].map((_,i)=>({k:i+1,n,valor:r2(cada+(i===0?resto:0)),data:stepFn?stepFn(i):addMonths(data,i),total:porParc?r2(valor*n):valor})); }
  if(c==="recorrente"){ const n=Math.max(2,Math.min(120,parseInt(fd.get("nRec"))||12)); const f=fd.get("freq")||"mensal";
    return [...Array(n)].map((_,i)=>({k:i+1,n,valor,data:stepFn&&f==="mensal"?stepFn(i):addFreq(data,i,f),freq:f,total:r2(valor*n)})); }
  return [{k:1,n:1,valor,data,total:valor}];
}
function condPreview(fd,valor,data,stepFn){
  if(!(valor>0)||!data) return `<span class="note">Informe valor e data para ver os lançamentos.</span>`;
  const pl=condPlan(fd,valor,data,stepFn); const c=fd.get("cond");
  return `<div class="facts"><div class="fact"><div class="l">${c==="avista"?"Lançamento":c==="parcelado"?"Parcelas":"Ocorrências"}</div><div class="v">${pl.length} × ${money(pl[pl.length-1].valor)}</div></div>

    <div class="fact"><div class="l">${pl.length>1?"Primeiro":"Data"}</div><div class="v">${dt(pl[0].data)}</div></div>
    ${pl.length>1?`<div class="fact"><div class="l">Último</div><div class="v">${dt(pl[pl.length-1].data)}</div></div>`:""}</div>`;
}

function salvarCartao(card, antigo){
  const cfg=clone(cardsCfg()); cfg.cartoes=cfg.cartoes||[]; const i=cfg.cartoes.findIndex(x=>x.id===card.id);
  if(i>=0) cfg.cartoes[i]=card; else cfg.cartoes.push(card); saveRec(cfg);
  // vincula lançamentos antigos que usavam só o nome
  byTipo("lanc").filter(r=>isCard(r)&&!r.cartaoId&&(r.cartao===card.nome||(antigo&&r.cartao===antigo.nome))).forEach(r=>{const y=clone(r);y.cartaoId=card.id;y.cartao=card.nome;saveRec(y);});
  if(antigo && antigo.nome!==card.nome) byTipo("lanc").filter(r=>r.cartaoId===card.id).forEach(r=>{const y=clone(r);y.cartao=card.nome;saveRec(y);});
  return card;
}

          cond, freq:p.freq||null, pago:o?!!o.pago:false, dataPagamento:o?o.dataPagamento||null:null}); });

/* --- Editar um lançamento do cartão (só este mês ou este e os próximos) --- */
function escopoBlock(r){
  const fut = r.grupo ? byTipo("lanc").filter(x=>x.grupo===r.grupo && x.vencimento>r.vencimento).length : 0;
  if (!r.grupo || (r.totalParcelas||1)<=1) return "";
  return `<div class="escopo"><span class="lb">${r.cond==="recorrente"?"Lançamento recorrente":"Lançamento parcelado"} · ${r.parcela} de ${r.totalParcelas} · ${mesNome(r.vencimento.slice(0,7))}</span>
    ${seg("escopo",[["este",`Alterar só ${MES_AB[+r.vencimento.slice(5,7)-1]}/${r.vencimento.slice(2,4)}`],...(fut?[["proximos",`Este e os próximos (${fut})`]]:[])],"este")}
    <span class="hint">“Só este mês” não muda os outros meses.</span></div>`;
}
function formItemCartao(id){
  const r=getRec(id); if(!r) return;
  openModal({title:`Editar lançamento · ${esc(cardNameOf(r))}`, color:"--c-cartao",
    body:`${escopoBlock(r)}
    <div class="fg">${fld("descricao","Descrição",inp("descricao",r.descricao,'autocomplete="off"'))}${fld("categoria","Categoria",catSelect("categoria","pagar",r.categoria))}</div>
    <div class="fg">${fld("valor","Valor (R$)",moneyInp("valor",r.valor))}${fld("vencimento","Vencimento da fatura",inp("vencimento",r.vencimento,'type="date"'),"Mude o mês para jogar este lançamento em outra fatura.")}</div>
    ${fld("obs","Observação",inp("obs",r.obs,'autocomplete="off"'))}
    <label class="chk"><input type="checkbox" name="pago" ${r.pago?"checked":""}> Já foi pago</label>`,
    extraButtons:`<button type="button" class="btn ghost" data-act="close-edit-compra" data-g="${esc(r.grupo||r.id)}">Editar a compra inteira</button>`,
    onSubmit: fd => {
      const valor=r2(parseMoney(fd.get("valor"))); if(!(valor>0)){toast("Informe um valor maior que zero.");return;}
      const categoria=catValue(fd,"categoria","pagar"); if(categoria===null) return;
      const base={descricao:String(fd.get("descricao")||"").trim()||r.descricao, categoria, obs:fd.get("obs")||""};
      const mudouValor = Math.abs(valor-r.valor)>0.004;
      Object.assign(r, base, {valor, vencimento:fd.get("vencimento")||r.vencimento, pago:!!fd.get("pago"), editado: r.editado || mudouValor || fd.get("vencimento")!==r.vencimento});
      r.dataPagamento = r.pago ? (r.dataPagamento||todayStr()) : null; saveRec(r);
      if (fd.get("escopo")==="proximos") byTipo("lanc").filter(x=>x.grupo===r.grupo && x.vencimento>r.vencimento).forEach(x=>{const y=clone(x);Object.assign(y,base,{valor});saveRec(y);});
      toast(fd.get("escopo")==="proximos"?"Este e os próximos atualizados.":"Lançamento deste mês atualizado."); closeModal();
    }});
}

    <div class="fg">${fld("valor",r?"Valor (R$)":"Valor (R$)",moneyInp("valor",r?.valor))}${fld("vencimento",nat==="pagar"?(r?"Vencimento":"Vencimento (1º)"):(r?"Data prevista":"Data prevista (1ª)"),inp("vencimento",r?.vencimento||todayStr(),'type="date"'))}
      ${fld("forma","Forma",selInp("forma",r&&r.forma&&!FORMAS.includes(r.forma)?[r.forma,...formas]:formas,r?.forma||"Pix"))}</div>
    ${fld("obs","Observação",inp("obs",r?.obs,'autocomplete="off"'))}

    ${r?`<label class="chk"><input type="checkbox" name="pago" ${r.pago?"checked":""}> ${nat==="pagar"?"Já foi pago":"Já foi recebido"}</label>`:`<label class="chk"><input type="checkbox" name="pago"> ${nat==="pagar"?"O primeiro já foi pago":"O primeiro já foi recebido"}</label>`}
    ${r?"":`<div class="preview" id="pv"></div>`}`,
    onInput: fd => { if(r) return; condShow(fd);

    }});
}

              <td><span class="catname"><i style="background:${catColor(x.f.categoria)}"></i>${esc(x.f.categoria||"")}</span></td><td class="r num">${money(x.tot)}</td><td>${x.pagas}/${x.it.length}</td><td class="r num">${money(x.aberto)}</td>

        </div>`:""}
      </div></div>`; };
  const totPer = sum(per,r=>r.valor);
  return `
  <div class="head"><div><h2><span class="sw">${icon(ui.view)}</span>Cartão de crédito</h2><p class="sub">Em contas a pagar entra uma fatura por cartão; no fluxo e na DRE, cada compra entra na sua categoria</p></div>

  <div class="kpis">
    <div class="kpi" style="--kc:var(--mc)"><span class="l">Faturas ${ui.per==="ano"?"de "+ano():"de "+mesNome(ui.mes)}</span><span class="v">${money(totPer)}</span><span class="d">${keys.filter(k=>per.some(r=>cardKey(r)===k)).length} cartão(ões) com fatura</span></div>
    <div class="kpi" style="--kc:var(--ok)"><span class="l">Pago</span><span class="v">${money(sum(per.filter(r=>r.pago),r=>r.valor))}</span><span class="d">no período</span></div>
    <div class="kpi" style="--kc:var(--idle)"><span class="l">Em aberto (todas)</span><span class="v">${money(sum(L.filter(r=>!r.pago),r=>r.valor))}</span><span class="d">${L.filter(r=>!r.pago).length} lançamento(s) futuros</span></div>
    <div class="kpi" style="--kc:var(--c-cartao)"><span class="l">Recorrentes ativos</span><span class="v">${money(sum(Object.values(grupos).filter(it=>it[0].cond==="recorrente"&&it.some(r=>!r.pago)).map(it=>it[0]),r=>r.valor))}</span><span class="d">por cobrança</span></div>
  </div>
  ${keys.length?`<div class="cctiles">${keys.map(tile).join("")}</div>`:`<div class="panel empty"><b>Cadastre seu primeiro cartão</b>Informe o nome, os 4 últimos números e os dias de fechamento e vencimento. As compras caem automaticamente na fatura certa.<div class="row" style="justify-content:center;margin-top:12px"><button class="btn pri" data-act="cartao-novo">+ Cadastrar cartão</button></div></div>`}`;

async function hashPin(pin, salt){
  const data = new TextEncoder().encode(salt+"|money|"+pin);
  if (globalThis.crypto && crypto.subtle) { const h = await crypto.subtle.digest("SHA-256", data); return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join(""); }
  return sha256Hex(data);
}

function fmtCPF(v){ const d=soDig(v).slice(0,11); return d.replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})(\d{1,2})$/,"$1-$2"); }
function fmtTel(v){ const d=soDig(v).slice(0,11); if(d.length<=10) return d.replace(/(\d{2})(\d)/,"($1) $2").replace(/(\d{4})(\d)/,"$1-$2"); return d.replace(/(\d{2})(\d)/,"($1) $2").replace(/(\d{5})(\d)/,"$1-$2"); }
function cpfValido(v){ const c=soDig(v); if(c.length!==11||/^(\d)\1+$/.test(c)) return false;
  const dv=n=>{ let s=0; for(let i=0;i<n;i++) s+=+c[i]*(n+1-i); const r=(s*10)%11; return r===10?0:r; }; return dv(9)===+c[9] && dv(10)===+c[10]; }

async function carregarDados(){
  const m=new Map(); let from=0; const step=1000;
  for(;;){ const {data,error}=await sb.from("registros").select("id,dados").eq("user_id",uidAtual).range(from,from+step-1); if(error) throw error;
    data.forEach(r=>m.set(r.id,r.dados)); if(data.length<step) break; from+=step; }
  recs=m;
}

function catValue(fd,id,nat,fallback="Outros"){

function contratoFromForm(fd,mod,c){
  const nomes=fd.getAll("tx_nome"), vals=fd.getAll("tx_valor"), tipos=fd.getAll("tx_tipo");

  return {...(c||{}), id:c?.id||uid("c"), tipo:"contrato", modalidade:mod, nome:String(fd.get("nome")||"").trim(), parte:String(fd.get("parte")||"").trim(), objeto:String(fd.get("objeto")||"").trim(),
    valorTotal:r2(parseMoney(fd.get("valorTotal"))), entrada:r2(parseMoney(fd.get("entrada"))), nParcelas:parseInt(fd.get("nParcelas"))||1, primeiroVenc:fd.get("primeiroVenc")||todayStr(),
    jaPagas:parseInt(fd.get("jaPagas"))||0, sistema:fd.get("sistema")||"price", taxa:parseMoney(fd.get("taxa")), taxaPeriodo:fd.get("taxaPeriodo")||"am",

/* Aporte mensal programado: cada parcela vira um aporte no próprio investimento quando a data chega (não entra em contas nem no fluxo) */
function progDatas(p){ const n=Math.max(1,Math.min(600,parseInt(p.n)||1)); return Array.from({length:n},(_,k)=>addMonths(p.inicio,k)); }
function progInfo(v){
  const p=v.programado; if(!p||!(p.valor>0)||!p.inicio) return null;
  const ds=progDatas(p), t=todayStr(); const feitos=ds.filter(d=>d<=t).length;
  return {valor:p.valor, n:ds.length, feitos, proximo:ds.find(d=>d>t)||null, fim:ds[ds.length-1]};
}
function aplicarProgramados(){
  const t=todayStr();
  for (const v of byTipo("invest")){
    const p=v.programado; if(!p||!(p.valor>0)||!p.inicio||!p.id) continue;
    const ds=progDatas(p); const mv=v.movimentos||[]; const tem=new Set(mv.filter(m=>m.prog).map(m=>m.prog));
    const novos=[]; ds.forEach((d,k)=>{ const key=p.id+":"+d; if(d<=t && !tem.has(key)) novos.push({id:uid("m"),tipo:"aporte",data:d,valor:r2(p.valor),prog:key,fluxo:false,obs:`Aporte programado ${k+1}/${ds.length}`}); });
    if(novos.length){ const y=clone(v); y.movimentos=[...(y.movimentos||[]),...novos]; saveRec(y); }
  }
}
function calcInv(v,r,ini,fd){
  const inicialTxt = String(fd.get("valorInicial")||"").trim();
  const inicial = inicialTxt ? r2(parseMoney(inicialTxt)) : (ini?ini.valor:0);
  const deltaIni = r2(inicial - (ini?ini.valor:0));
  const aporte = v ? Math.max(0,r2(parseMoney(fd.get("aporte")))) : 0;
  const saldo0 = v ? r.saldo : 0, ap0 = v ? r.ap : 0, ganho0 = v ? r.ganho : 0;
  const base = r2(saldo0 + deltaIni + aporte);
  const atualTxt = String(fd.get("valorAtual")||"").trim(); const temAtual = !!atualTxt;
  const atual = temAtual ? r2(parseMoney(atualTxt)) : base;
  const diff = r2(atual - base);
  const investido = r2(ap0 + deltaIni + aporte);
  const aportesAnt = v ? r2(ap0 - (ini?ini.valor:0)) : 0;
  return {rs: v ? r.rs : 0, inicial, aporte, aportesAnt, aportesTot:r2(aportesAnt+aporte), base, atual, temAtual, diff, investido, ganho:r2(ganho0+diff)};
}

    let y=98;
    const need = h => { if(y+h>PH-40){ doc.addPage(); y=44; } };
    for(const b of spec.blocks){
      if(b.type==="kpis"){

        b.items.forEach((it,i)=>{ if(i%per===0){ if(i) y+=h+gap; need(h); }

          doc.setFillColor(...hexRgb(LIGHT[it[2]]||"#6b7770")); doc.circle(x+12,y+14,3,"F");

          doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.setTextColor(16,26,21); doc.text(pdfTxt(it[1]),x+12,y+36); });
        y+=h+18;

        const w=PW-2*M; let h=w*img.H/img.W; const maxH=b.h||(spec.landscape?200:230); let ww=w; if(h>maxH){ h=maxH; ww=h*img.W/img.H; }
        need(h+22); doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(16,26,21); doc.text(pdfTxt(b.title||""),M,y); y+=8;
        doc.addImage(img.data,"PNG",M+(w-ww)/2,y,ww,h); y+=h+18;
      } else if(b.type==="table"){

        const colStyles={}; (b.num||[]).forEach(i=>colStyles[i]={halign:"right"});
        if(!b.body.length){ doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(95,107,101); doc.text("Sem registros no período.",M,y+12); y+=30; continue; }
        doc.autoTable({startY:y,head:[b.head],body:b.body,foot:b.foot?[b.foot]:undefined,margin:{left:M,right:M,top:44,bottom:40},theme:"plain",
          styles:{font:"helvetica",fontSize:b.small?7:8.5,cellPadding:b.small?3:4.5,textColor:[16,26,21],lineColor:[226,232,228],lineWidth:{bottom:.5},overflow:"linebreak"},
          headStyles:{fillColor:color,textColor:[255,255,255],fontStyle:"bold",fontSize:b.small?7:8.5},

          showFoot:"lastPage", didParseCell:d=>{ if(d.section!=="body" && (b.num||[]).includes(d.column.index)) d.cell.styles.halign="right"; }});
        y=doc.lastAutoTable.finalY+22;

/* ============ Backup ============ */
async function download(filename,data){
  try{ const blob = data instanceof Blob ? data : new Blob([data],{type:filename.endsWith(".json")?"application/json":filename.endsWith(".csv")?"text/csv;charset=utf-8":"application/octet-stream"});
    const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); toast("Arquivo baixado: "+filename); }
  catch(e){ toast("Não foi possível gerar o arquivo."); }
}
