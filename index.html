    <div class="kpi" style="--kc:var(--accent)"><span class="l">Usuários cadastrados</span><span class="v">${L.length}</span><span class="d">${L.filter(u=>u.confirmado).length} com e-mail confirmado</span></div>

    <div class="kpi" style="--kc:#229ED9"><span class="l">Telegram conectado</span><span class="v">${L.filter(u=>u.telegram_conectado).length}</span><span class="d">${L.filter(u=>u.telegram_liberado).length} liberado(s)</span></div>
  </div>
  <div class="toolbar"><input type="search" id="adm-busca" placeholder="Buscar nome, e-mail ou telefone…" value="${esc(adminBusca)}"></div>
  <div class="tw"><table style="min-width:900px"><thead><tr><th>Nome</th><th>E-mail</th><th>Telefone</th><th>Cadastro</th><th>Último acesso</th><th>Última atividade</th><th>Telegram</th></tr></thead><tbody>
    ${F.map(u=>{ const ativo=(u.ultima_atividade||u.ultimo_acesso||"").slice(0,10)>=d30; return `<tr><td class="desc">${esc(u.nome||"—")}${u.confirmado?"":`<small>e-mail não confirmado</small>`}</td><td>${esc(u.email)}</td><td>${esc(u.telefone||"—")}</td><td class="num">${dth(u.cadastro)}</td><td class="num">${dth(u.ultimo_acesso)}</td>

      <td>${u.telegram_conectado?`<span class="pill st-pago">Conectado</span>`:u.telegram_liberado?`<span class="pill st-proximo">Liberado</span>`:""} <button class="btn sm ${u.telegram_liberado?"ghost":""}" data-act="adm-tg" data-email="${esc(u.email)}" data-on="${u.telegram_liberado?0:1}">${u.telegram_liberado?"Tirar":"Liberar"}</button></td></tr>`; }).join("")||`<tr><td colspan="7" class="note">Nenhum usuário encontrado.</td></tr>`}

async function cadSubmit(form){
  const g=id=>String(form.querySelector("#"+id)?.value||"").trim(); const p=clone(perfil()||{id:PERFIL_ID,tipo:"config"});
  if(form.id==="cadform"){ const e=$("#pferr"); const nome=g("pf_nome"),tel=g("pf_tel"),cpf=g("pf_cpf");
    const f=!nome?"Informe seu nome.":(tel&&soDig(tel).length<10)?"Telefone incompleto (inclua o DDD).":(cpf&&!cpfValido(cpf))?"CPF inválido.":""; if(f){e.textContent=f;return;}
    Object.assign(p,{nome,telefone:tel?fmtTel(tel):"",cpf:cpf?fmtCPF(cpf):""}); saveRec(p); e.textContent=""; toast("Dados salvos."); return; }
  if(form.id==="pwform"){ const e=$("#pwerr"); const a=form.querySelector("#pw_nova").value, b=form.querySelector("#pw_nova2").value;
    if(a.length<6){e.textContent="Mínimo de 6 caracteres.";return;} if(a!==b){e.textContent="As senhas não conferem.";return;}
    const {error}=await sb.auth.updateUser({password:a}); if(error){ e.textContent=traduzErro(error); return; } form.reset(); e.textContent=""; toast("Senha da conta alterada."); return; }
  const e=$("#pserr"); if(p.pinHash){ const m=await tentarPin(g("ps_atual")); if(m){ e.textContent=m.replace("Senha incorreta","Senha rápida atual incorreta"); return; } }
  const n=g("ps_nova"); if(!/^\d{4}$/.test(n)){e.textContent="A senha rápida deve ter 4 números.";return;} if(n!==g("ps_nova2")){e.textContent="As senhas não conferem.";return;}
  p.salt=uid("s"); p.pinHash=await hashPin(n,p.salt); delete p.pinLivre; saveRec(p); form.reset(); e.textContent=""; ui.sec=false; toast("Senha rápida salva e ativada."); render();
}

/* ============ Modais ============ */
let modalSubmit = null, modalInput = null;
function openModal({title,color,body,submitLabel="Salvar",extraButtons="",onSubmit,onInput}){
  modalSubmit = onSubmit; modalInput = onInput||null;
  $("#modalRoot").innerHTML = `<div class="ov" data-act="ov"><form class="modal" id="mform" style="--mc:var(${color||"--accent"})" novalidate>
    <header><h3>${title}</h3><button type="button" class="icon-btn" data-act="close" aria-label="Fechar">✕</button></header>
    <div class="bd">${body}</div>
    <footer>${extraButtons}<button type="button" class="btn" data-act="close">Cancelar</button>${onSubmit?`<button type="submit" class="btn pri">${submitLabel}</button>`:""}</footer></form></div>`;
  const first = $("#mform .bd input:not([type=hidden]):not([type=radio]):not([type=checkbox]), #mform .bd select");
  if (first) setTimeout(()=>first.focus(),30);
  if (modalInput) modalInput(new FormData($("#mform")));
}
function closeModal(){ $("#modalRoot").innerHTML=""; modalSubmit=null; modalInput=null; if(ui.auth && ui.view==="cadastro") setTimeout(render,0); }
function ask(title,msg,buttons,color){
  openModal({title,color,body:`<p style="margin:0">${msg}</p>`,extraButtons:buttons.map((b,i)=>`<button type="button" class="btn ${b.cls||""}" data-act="ask" data-i="${i}">${b.label}</button>`).join("")});
  ask.btns = buttons;
}
const fld = (id,label,input,hint="") => `<div class="f"><label for="${id}">${label}</label>${input}${hint?`<span class="hint">${hint}</span>`:""}</div>`;
const inp = (id,val,attrs="") => `<input id="${id}" name="${id}" value="${esc(val??"")}" ${attrs}>`;
const moneyInp = (id,val,attrs="") => inp(id,mIn(val),`inputmode="decimal" placeholder="0,00" autocomplete="off" ${attrs}`);
const selInp = (id,opts,val) => `<select id="${id}" name="${id}">${opts.map(o=>Array.isArray(o)?o:[o,o]).map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(val)?"selected":""}>${esc(l)}</option>`).join("")}</select>`;
const seg = (name,opts,val) => `<div class="seg" role="radiogroup">${opts.map(([v,l])=>`<label><input type="radio" name="${name}" value="${v}" ${v===val?"checked":""}>${l}</label>`).join("")}</div>`;
const dl = (id,list) => `<datalist id="${id}">${list.map(c=>`<option value="${esc(c)}">`).join("")}</datalist>`;
function catSelect(id,nat,val,primeiro){
  const L = catList(nat).map(c=>c.nome); if(val && !L.includes(val)) L.push(val);
  return `<div class="catpick"><select id="${id}" name="${id}">${primeiro?`<option value="">${esc(primeiro)}</option>`:""}${L.map(n=>`<option value="${esc(n)}" ${n===val?"selected":""}>${esc(n)}</option>`).join("")}<option value="__nova__">+ Nova categoria…</option></select>
    <input id="${id}_nova" name="${id}_nova" placeholder="Nome da nova categoria" autocomplete="off" hidden></div>`;
}
function catValue(fd,id,nat,fallback="Outros"){
  let v = String(fd.get(id)||"");
  if (v==="__nova__"){ v = String(fd.get(id+"_nova")||"").trim(); if(!v){ toast("Digite o nome da nova categoria."); const el=document.getElementById(id+"_nova"); el&&el.focus(); return null; } addCategoria(nat,v); }
  return v || fallback;
}
function req(fd,keys){ for(const [k,l] of keys){ if(!String(fd.get(k)||"").trim()){ toast(`Preencha: ${l}`); const el=document.getElementById(k); el&&el.focus(); return false; } } return true; }

/* --- Contratos --- */
function formContrato(mod,id){
  const M = MODS[mod]; const c = id?getRec(id):null; const rec = M.nat==="receber";
  const count = byTipo("contrato").filter(x=>x.modalidade===mod).length;
  const taxas = c?.taxas?.length ? c.taxas : [];
  const defNome = rec ? "" : `${M.sing} ${count+1}`;
  const taxRow = (t={},i) => `<div class="taxrow" data-tax>
      <input name="tx_nome" placeholder="Ex.: Seguro, IOF, TAC" value="${esc(t.nome||"")}" aria-label="Nome da taxa">
      <input name="tx_valor" inputmode="decimal" placeholder="R$ 0,00" value="${esc(mIn(t.valor))}" aria-label="Valor da taxa">
      <select name="tx_tipo" aria-label="Como é cobrada">${[["mensal","Em toda parcela"],["financiada","Somada ao financiado"],["avista","Uma vez, na 1ª parcela"]].map(([v,l])=>`<option value="${v}" ${t.tipo===v?"selected":""}>${l}</option>`).join("")}</select>
      <button type="button" class="icon-btn" data-act="tx-del" aria-label="Remover taxa">✕</button></div>`;
  formContrato.taxRow = taxRow;
  openModal({title: c?`Editar ${esc(c.nome)}`:(rec?"Novo devedor":`Novo ${M.sing.toLowerCase()}`), color:`--c-${mod}`,
    body:`
    <div class="fg">${fld("nome",rec?"Identificação":"Nome do contrato",inp("nome",c?.nome??defNome,`placeholder="${rec?"Ex.: João – empréstimo":M.sing+" 1"}" autocomplete="off"`))}
      ${fld("parte",M.parte,inp("parte",c?.parte,`placeholder="${M.parteHint}" autocomplete="off"`))}</div>
    <div class="fg">${fld("objeto",M.obj,inp("objeto",c?.objeto,`placeholder="${M.objHint}" autocomplete="off"`))}
      ${fld("categoria","Categoria",catSelect("categoria",M.nat,c?.categoria||"",`Padrão (${M.sing})`),"Aparece em contas a "+M.nat+" e nos relatórios.")}</div>
    <div class="escopo"><span class="lb" style="font-weight:700;color:var(--fg)">O que fazer com as parcelas?</span>
      ${seg("entraFluxo",[["sim",`Lançar em contas a ${M.nat} e no fluxo`],["nao","Só anotação"]],(c?!foraFluxo(c):mod!=="aquisicao")?"sim":"nao")}
      <span class="hint"><b>Lançar:</b> descrição, categoria, parcelas, datas e valores viram lançamentos em contas a ${M.nat} e no fluxo de caixa, ligados a este card — ao marcar como ${M.nat==="pagar"?"paga":"recebida"} lá (ou aqui), o card atualiza. <b>Só anotação:</b> fica apenas nesta aba, sem entrar em contas nem no fluxo. Dá para mudar depois, no próprio card.</span></div>
    <div class="sectitle">Valores</div>
    <div class="fg">${fld("valorTotal",rec?"Valor devido (R$)":"Valor total do bem / contrato (R$)",moneyInp("valorTotal",c?.valorTotal))}
      ${fld("entrada","Entrada (R$)",moneyInp("entrada",c?.entrada),rec?"Valor que já foi pago de início, se houver.":"Abatida do valor financiado.")}</div>
    <div class="fg">${fld("nParcelas","Nº de parcelas",inp("nParcelas",c?.nParcelas||(rec?1:12),'type="number" min="1" max="600"'))}
      ${fld("primeiroVenc","Vencimento da 1ª parcela",inp("primeiroVenc",c?.primeiroVenc||addMonths(todayStr(),1),'type="date"'))}
      ${fld("jaPagas",rec?"Parcelas já recebidas":"Parcelas já pagas",inp("jaPagas",c?.jaPagas||0,'type="number" min="0"'),"Para contratos que já estão em andamento.")}</div>
    <div class="sectitle">Juros</div>
    <div class="f"><span class="lb">Sistema de cálculo</span>${seg("sistema",[["price","Price · parcelas iguais"],["sac","SAC · parcelas decrescentes"],["sem","Sem juros"]],c?.sistema||(rec?"sem":"price"))}</div>
    <div class="fg">${fld("taxa","Taxa de juros (%)",inp("taxa",c?.taxa?String(c.taxa).replace(".",","):"",'inputmode="decimal" placeholder="Ex.: 1,49"'))}
      ${fld("taxaPeriodo","Período da taxa",selInp("taxaPeriodo",[["am","ao mês (a.m.)"],["aa","ao ano (a.a.)"]],c?.taxaPeriodo||"am"))}
      ${fld("parcelaInformada","Não sabe a taxa? Valor da parcela",moneyInp("parcelaInformada",c?.parcelaInformada),"Deixe a taxa em branco e informe a parcela: a taxa é calculada.")}</div>
    <div class="sectitle">Outras taxas e encargos</div>
    <div class="taxas" id="taxas">${taxas.map(taxRow).join("")}</div>
    <div><button type="button" class="btn sm" data-act="tx-add">+ Adicionar taxa</button></div>
    ${fld("obs","Observação",inp("obs",c?.obs,'autocomplete="off"'))}
    <div class="preview" id="pv"></div>`,
    onInput: fd => { const d=contratoFromForm(fd,mod,c); const pv=$("#pv"); if(!pv) return;
      if(!(principal(d)>0)){ pv.innerHTML=`<span class="note">Informe o valor para simular as parcelas.</span>`; return; }
      const ps = gerarParcelas(d,c?.parcelas); const tM = d.taxaCalculada||taxaMensal(d);
      const juros=sum(ps,p=>p.juros), tx=sum(ps,p=>p.taxas)+sum((d.taxas||[]).filter(t=>t.tipo==="financiada"),t=>t.valor), total=sum(ps,p=>p.valor)+(Number(d.entrada)||0);
      pv.innerHTML = `<div class="facts">
        <div class="fact"><div class="l">${d.sistema==="sac"?"1ª parcela":"Parcela"}</div><div class="v">${money(ps[0].valor)}</div></div>
        ${d.sistema==="sac"?`<div class="fact"><div class="l">Última parcela</div><div class="v">${money(ps[ps.length-1].valor)}</div></div>`:""}
        <div class="fact"><div class="l">Taxa mensal</div><div class="v">${d.sistema==="sem"?"0%":pctf(tM,3)}${d.taxaCalculada?" *":""}</div></div>
        <div class="fact"><div class="l">Taxa anual equiv.</div><div class="v">${d.sistema==="sem"?"0%":pctf((Math.pow(1+tM/100,12)-1)*100,2)}</div></div>
        <div class="fact"><div class="l">Total de juros</div><div class="v">${money(juros)}</div></div>
        <div class="fact"><div class="l">Outras taxas</div><div class="v">${money(tx)}</div></div>
        <div class="fact"><div class="l">Custo total</div><div class="v"><b>${money(total)}</b></div></div>
        <div class="fact"><div class="l">Última parcela em</div><div class="v">${dt(ps[ps.length-1].venc)}</div></div></div>
        ${d.taxaCalculada?`<p class="note" style="margin:8px 0 0">* Taxa calculada a partir da parcela informada.</p>`:""}`; },
    onSubmit: fd => {
      if(!req(fd,[["nome","nome"],["valorTotal","valor"],["nParcelas","nº de parcelas"],["primeiroVenc","vencimento da 1ª parcela"]])) return;
      const d = contratoFromForm(fd,mod,c);
      if(!(principal(d)>0)){toast("O valor precisa ser maior que a entrada.");return;}
      const cat = catValue(fd,"categoria",M.nat,""); if(cat===null) return; d.categoria = cat;
      d.parcelas = gerarParcelas(d,c?.parcelas);
      saveRec(d); ui.view=mod; ui.open.add(d.id); toast(c?"Registro atualizado e parcelas recalculadas.":foraFluxo(d)?`${d.parcelas.length} parcela(s) geradas nesta aba.`:`${d.parcelas.length} parcela(s) geradas em contas a ${M.nat}.`); closeModal();
    }});
}
function contratoFromForm(fd,mod,c){
  const nomes=fd.getAll("tx_nome"), vals=fd.getAll("tx_valor"), tipos=fd.getAll("tx_tipo");
  const taxas = nomes.map((n,i)=>({nome:n.trim()||"Taxa",valor:r2(parseMoney(vals[i])),tipo:tipos[i]})).filter(t=>t.valor>0);
  return {...(c||{}), id:c?.id||uid("c"), tipo:"contrato", modalidade:mod, nome:String(fd.get("nome")||"").trim(), parte:String(fd.get("parte")||"").trim(), objeto:String(fd.get("objeto")||"").trim(),
    valorTotal:r2(parseMoney(fd.get("valorTotal"))), entrada:r2(parseMoney(fd.get("entrada"))), nParcelas:parseInt(fd.get("nParcelas"))||1, primeiroVenc:fd.get("primeiroVenc")||todayStr(),
    jaPagas:parseInt(fd.get("jaPagas"))||0, sistema:fd.get("sistema")||"price", taxa:parseMoney(fd.get("taxa")), taxaPeriodo:fd.get("taxaPeriodo")||"am",
    parcelaInformada:r2(parseMoney(fd.get("parcelaInformada"))), taxas, obs:fd.get("obs")||"", semFluxo: mod!=="aquisicao" && fd.get("entraFluxo")!=="sim", comFluxo: mod==="aquisicao" && fd.get("entraFluxo")==="sim"};
}

/* --- Investimentos --- */
function movInicial(v){ const ap=(v.movimentos||[]).filter(m=>m.tipo==="aporte"); const f=ap.find(m=>m.inicial); if(f||v.semInicial) return f||null; return ap.filter(m=>!m.prog).sort((a,b)=>a.data.localeCompare(b.data))[0] || null; }
function chipsHtml(){ const L=formInvest.tmp||[]; return L.length?L.map(a=>`<span class="achip"><b>${esc(a.codigo)}</b>${a.qtd?`<small>${Number(a.qtd).toLocaleString("pt-BR",{maximumFractionDigits:8})}</small>`:""}<button type="button" data-act="chip-del" data-a="${a.id}" aria-label="Remover ${esc(a.codigo)}" title="Vendi / remover">×</button></span>`).join(""):`<span class="note">Nenhum ativo ainda. Digite o código e toque em Adicionar.</span>`; }
function chipAdd(){

/* Aporte mensal programado: cada parcela vira um aporte no próprio investimento quando a data chega (não entra em contas nem no fluxo) */
function progDatas(p){ const n=Math.max(1,Math.min(600,parseInt(p.n)||1)); return Array.from({length:n},(_,k)=>addMonths(p.inicio,k)); }
function progInfo(v){
  const p=v.programado; if(!p||!(p.valor>0)||!p.inicio) return null;
  const ds=progDatas(p), t=todayStr(); const feitos=ds.filter(d=>d<=t).length;
  return {valor:p.valor, n:ds.length, feitos, proximo:ds.find(d=>d>t)||null, fim:ds[ds.length-1]};
}
function aplicarProgramados(){
  const t=todayStr();
  for (const v of byTipo("invest")){
    const p=v.programado; if(!p||!(p.valor>0)||!p.inicio||!p.id) continue;
    const ds=progDatas(p); const mv=v.movimentos||[]; const tem=new Set(mv.filter(m=>m.prog).map(m=>m.prog));
    const novos=[]; ds.forEach((d,k)=>{ const key=p.id+":"+d; if(d<=t && !tem.has(key)) novos.push({id:uid("m"),tipo:"aporte",data:d,valor:r2(p.valor),prog:key,fluxo:false,obs:`Aporte programado ${k+1}/${ds.length}`}); });
    if(novos.length){ const y=clone(v); y.movimentos=[...(y.movimentos||[]),...novos]; saveRec(y); }
  }
}
function calcInv(v,r,ini,fd){
  const inicialTxt = String(fd.get("valorInicial")||"").trim();
  const inicial = inicialTxt ? r2(parseMoney(inicialTxt)) : (ini?ini.valor:0);
  const deltaIni = r2(inicial - (ini?ini.valor:0));
  const aporte = v ? Math.max(0,r2(parseMoney(fd.get("aporte")))) : 0;
  const saldo0 = v ? r.saldo : 0, ap0 = v ? r.ap : 0, ganho0 = v ? r.ganho : 0;
  const base = r2(saldo0 + deltaIni + aporte);
  const atualTxt = String(fd.get("valorAtual")||"").trim(); const temAtual = !!atualTxt;
  const atual = temAtual ? r2(parseMoney(atualTxt)) : base;
  const diff = r2(atual - base);
  const investido = r2(ap0 + deltaIni + aporte);
  const aportesAnt = v ? r2(ap0 - (ini?ini.valor:0)) : 0;
  return {rs: v ? r.rs : 0, inicial, aporte, aportesAnt, aportesTot:r2(aportesAnt+aporte), base, atual, temAtual, diff, investido, ganho:r2(ganho0+diff)};
}

let pdfBusy=false;
async function gerarPDF(){
  if(pdfBusy) return; pdfBusy=true; toast("Gerando relatório…");
  try{
    let jsPDF; try{ jsPDF = await loadPdf(); }catch(e){ toast("Não foi possível carregar o gerador de PDF. Verifique a conexão e tente de novo."); return; }

    const doc = new jsPDF({unit:"pt",format:"a4",orientation:spec.landscape?"landscape":"portrait"});
    const PW=doc.internal.pageSize.getWidth(), PH=doc.internal.pageSize.getHeight(), M=36;
    // cabeçalho
    doc.setFillColor(15,26,21); doc.rect(0,0,PW,74,"F");
    doc.setFillColor(...color); doc.rect(0,74,PW,3,"F");

    doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(190,205,198); doc.text(pdfTxt(spec.sub),PW-M,51,{align:"right"});
    doc.setFontSize(8); doc.text("Gerado em "+dt(todayStr())+" às "+new Date().toTimeString().slice(0,5),PW-M,64,{align:"right"});
    let y=98;
    const need = h => { if(y+h>PH-40){ doc.addPage(); y=44; } };
    for(const b of spec.blocks){
      if(b.type==="kpis"){
        const per=4, gap=8, w=(PW-2*M-gap*(per-1))/per, h=46;
        b.items.forEach((it,i)=>{ if(i%per===0){ if(i) y+=h+gap; need(h); }
          const x=M+(i%per)*(w+gap); doc.setFillColor(244,246,245); doc.roundedRect(x,y,w,h,6,6,"F");
          doc.setFillColor(...hexRgb(LIGHT[it[2]]||"#6b7770")); doc.circle(x+12,y+14,3,"F");
          doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(95,107,101); doc.text(pdfTxt(it[0]),x+20,y+17);
          doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.setTextColor(16,26,21); doc.text(pdfTxt(it[1]),x+12,y+36); });
        y+=h+18;
      } else if(b.type==="chart"){
        const img=await svgPng(b.svg); if(!img) continue;
        const w=PW-2*M; let h=w*img.H/img.W; const maxH=b.h||(spec.landscape?200:230); let ww=w; if(h>maxH){ h=maxH; ww=h*img.W/img.H; }
        need(h+22); doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(16,26,21); doc.text(pdfTxt(b.title||""),M,y); y+=8;
        doc.addImage(img.data,"PNG",M+(w-ww)/2,y,ww,h); y+=h+18;
      } else if(b.type==="table"){
        need(40); doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(16,26,21); doc.text(pdfTxt(b.title),M,y); y+=6;
        const colStyles={}; (b.num||[]).forEach(i=>colStyles[i]={halign:"right"});
        if(!b.body.length){ doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(95,107,101); doc.text("Sem registros no período.",M,y+12); y+=30; continue; }
        doc.autoTable({startY:y,head:[b.head],body:b.body,foot:b.foot?[b.foot]:undefined,margin:{left:M,right:M,top:44,bottom:40},theme:"plain",
          styles:{font:"helvetica",fontSize:b.small?7:8.5,cellPadding:b.small?3:4.5,textColor:[16,26,21],lineColor:[226,232,228],lineWidth:{bottom:.5},overflow:"linebreak"},
          headStyles:{fillColor:color,textColor:[255,255,255],fontStyle:"bold",fontSize:b.small?7:8.5},
          footStyles:{fillColor:[238,242,240],textColor:[16,26,21],fontStyle:"bold"},
          alternateRowStyles:{fillColor:[249,250,250]}, columnStyles:{...colStyles,0:{...(colStyles[0]||{}),...(b.small?{cellWidth:110}:{})}},
          showFoot:"lastPage", didParseCell:d=>{ if(d.section!=="body" && (b.num||[]).includes(d.column.index)) d.cell.styles.halign="right"; }});
        y=doc.lastAutoTable.finalY+22;
      } else if(b.type==="text"){
        const lines=doc.splitTextToSize(b.text,PW-2*M-24); const h=lines.length*11+46; need(Math.min(h,PH-90));
        doc.setFillColor(240,240,252); doc.roundedRect(M,y,PW-2*M,Math.min(h,PH-y-40),8,8,"F");
        doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(79,70,229); doc.text(pdfTxt(b.title),M+12,y+18);
        doc.setFont("helvetica","italic"); doc.setFontSize(8.5); doc.setTextColor(95,107,101); doc.text(doc.splitTextToSize("Pergunta: "+pdfTxt(b.q),PW-2*M-24),M+12,y+31);
        doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(16,26,21);
        let yy=y+46; for(const ln of lines){ if(yy>PH-44){ doc.addPage(); yy=44; } doc.text(ln,M+12,yy); yy+=11; } y=yy+16;
      }
    }
    const n=doc.getNumberOfPages();
    for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(140,150,145);

/* ============ Backup ============ */
async function download(filename,data){
  try{ const blob = data instanceof Blob ? data : new Blob([data],{type:filename.endsWith(".json")?"application/json":filename.endsWith(".csv")?"text/csv;charset=utf-8":"application/octet-stream"});
    const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); toast("Arquivo baixado: "+filename); }
  catch(e){ toast("Não foi possível gerar o arquivo."); }
}

    case "per": ui.per=b.dataset.p; render(); break;
    case "pdf": gerarPDF(); break;
    case "fx-mes": ui.fxIni=shiftMonth(ui.fxIni,+b.dataset.d*(ui.fxAno?12:ui.fxN>=6?3:1)); render(); break;
    case "pago": togglePago(b.dataset.key); break;
    case "novo-lanc": formLanc(b.dataset.nat); break;
    case "edit-lanc": { const r=getRec(b.dataset.id); r&&formLanc(r.natureza,r.id); break; }
    case "del-lanc": { const r=getRec(b.dataset.id); if(!r) break; const fut=r.grupo?byTipo("lanc").filter(x=>x.grupo===r.grupo&&x.vencimento>r.vencimento):[];
      ask("Excluir lançamento",`Excluir <b>${esc(r.descricao)}</b> de ${dt(r.vencimento)}?`,[{label:"Excluir",cls:"danger",fn:()=>{delRec(r.id);toast("Lançamento excluído.");}},...(fut.length?[{label:`Excluir este e os próximos (${fut.length})`,cls:"danger",fn:()=>{delRec(r.id);fut.forEach(x=>delRec(x.id));toast(`${fut.length+1} lançamentos excluídos.`);}}]:[])], r.natureza==="pagar"?"--c-pagar":"--c-receber"); break; }
    case "toggle-dash": ui.dash.has(b.dataset.id)?ui.dash.delete(b.dataset.id):ui.dash.add(b.dataset.id); render(); break;
    case "chip-add": chipAdd(); break;
    case "chip-del": formInvest.tmp=(formInvest.tmp||[]).filter(a=>a.id!==b.dataset.a); { const c=$("#achips"); if(c) c.innerHTML=chipsHtml(); } break;
    case "edit-item-cartao": formItemCartao(b.dataset.id); break;
    case "close-edit-compra": closeModal(); formCompra(b.dataset.g); break;
    case "nova-compra": formCompra(null, b.dataset.k&&!b.dataset.k.startsWith("n:")?{cartaoId:b.dataset.k}:null); break;
    case "cartao-novo": formCartao(); break;
    case "cartao-edit": formCartao(b.dataset.id); break;
    case "cartao-reg": { closeModal(); formCartao(); setTimeout(()=>{const el=$("#cc_nome"); if(el) el.value=b.dataset.n;},80); break; }
    case "cartao-del": { const c=cartoes().find(x=>x.id===b.dataset.id); if(!c) break; const n=byTipo("lanc").filter(r=>r.cartaoId===c.id).length;
      ask("Excluir cartão",`Excluir o cartão <b>${esc(cardLabel(c))}</b>?${n?` Os ${n} lançamentos dele continuam salvos com o nome do cartão.`:""}`,[{label:"Excluir cartão",cls:"danger",fn:()=>{const cfg=clone(cardsCfg()); cfg.cartoes=cfg.cartoes.filter(x=>x.id!==c.id); saveRec(cfg); byTipo("lanc").filter(r=>r.cartaoId===c.id).forEach(r=>{const y=clone(r);y.cartaoId=null;saveRec(y);}); toast("Cartão excluído.");}}],"--c-cartao"); break; }
    case "goto-fatura": ui.view="cartao"; ui.per="mes"; ui.mes=b.dataset.m; render(); window.scrollTo(0,0); break;
    case "edit-compra": formCompra(b.dataset.g); break;
    case "del-compra": { const it=byTipo("lanc").filter(r=>(r.grupo||r.id)===b.dataset.g); ask("Excluir compra",`Excluir <b>${esc(it[0]?.descricao)}</b> e suas ${it.length} parcela(s)?`,[{label:"Excluir compra",cls:"danger",fn:()=>{it.forEach(x=>delRec(x.id));toast("Compra excluída.");}}],"--c-cartao"); break; }
    case "fatura": { const v=b.dataset.v==="1"; byTipo("lanc").filter(r=>isCard(r)&&cardKey(r)===b.dataset.k&&(ui.per==="ano"&&!b.dataset.m?inPer(r.vencimento):r.vencimento.slice(0,7)===(b.dataset.m||ui.mes))&&!!r.pago!==v).forEach(r=>{const y=clone(r);y.pago=v;y.dataPagamento=v?todayStr():null;saveRec(y);}); toast(v?"Fatura marcada como paga.":"Fatura reaberta."); break; }
    case "novo-contrato": formContrato(b.dataset.mod); break;
    case "fluxo-contrato": { const c0=getRec(b.dataset.id); if(!c0) break; const c=clone(c0); const lancar=foraFluxo(c);
      if(c.modalidade==="aquisicao") c.comFluxo=lancar; else c.semFluxo=!lancar; saveRec(c);
      const nat=MODS[c.modalidade].nat; toast(lancar?`Parcelas lançadas em contas a ${nat} e no fluxo.`:"Agora é só anotação: saiu de contas e do fluxo."); break; }
    case "edit-contrato": { const c=getRec(b.dataset.id); c&&formContrato(c.modalidade,c.id); break; }
    case "open-contrato": ui.open.add(b.dataset.id); goView(b.dataset.mod, ()=>setTimeout(()=>{const el=document.getElementById("ct-"+b.dataset.id); el&&el.scrollIntoView({block:"start"});},50)); break;
    case "del-contrato": { const c=getRec(b.dataset.id); if(!c) break; ask("Excluir registro",`Excluir <b>${esc(c.nome)}</b>? Todas as ${c.parcelas?.length||0} parcelas saem de contas a ${MODS[c.modalidade].nat}.`,[{label:"Excluir",cls:"danger",fn:()=>{delRec(c.id);toast("Registro excluído.");}}],`--c-${c.modalidade}`); break; }
    case "cc-open": { const k="ct:"+b.dataset.k; ui.open.has(k)?ui.open.delete(k):ui.open.add(k); render(); break; }
    case "row-card": { const k="rc:"+b.dataset.k; ui.open.has(k)?ui.open.delete(k):ui.open.add(k); render(); break; }
    case "toggle-parcelas": ui.open.has(b.dataset.id)?ui.open.delete(b.dataset.id):ui.open.add(b.dataset.id); render(); break;
    case "tx-add": { const w=$("#taxas"); w.insertAdjacentHTML("beforeend",formContrato.taxRow({tipo:"mensal"})); w.lastElementChild.querySelector("input").focus(); modalInput&&modalInput(new FormData($("#mform"))); break; }
    case "tx-del": b.closest("[data-tax]").remove(); modalInput&&modalInput(new FormData($("#mform"))); break;
    case "novo-invest": formInvest(); break;
    case "edit-parcela": formParcela(b.dataset.id,b.dataset.idx); break;
    case "parc-restaurar": closeModal(); restaurarParcela(b.dataset.id,b.dataset.idx); break;
    case "cat-add": { const el=document.getElementById("nc-"+b.dataset.nat); const n=(el?.value||"").trim(); if(!n){toast("Digite o nome da categoria.");el&&el.focus();break;} if(catList(b.dataset.nat).some(x=>x.nome.toLowerCase()===n.toLowerCase())){toast("Essa categoria já existe.");break;} addCategoria(b.dataset.nat,n); el.value=""; toast("Categoria criada."); break; }
    case "cat-edit": formCategoria(b.dataset.nat,b.dataset.n); break;
    case "cat-del": formCategoriaDel(b.dataset.nat,b.dataset.n); break;
    case "edit-invest": formInvest(b.dataset.id,"nome"); break;
    case "atualizar-invest": formInvest(b.dataset.id,"valorAtual"); break;
    case "aporte-invest": formInvest(b.dataset.id,"aporte"); break;
    case "mov-invest": formMov(b.dataset.id); break;
    case "saldo-invest": formSaldo(b.dataset.id); break;
    case "del-invest": { const v=getRec(b.dataset.id); if(!v) break; ask("Excluir investimento",`Excluir <b>${esc(v.nome)}</b> e todo o histórico de movimentos?`,[{label:"Excluir",cls:"danger",fn:()=>{delRec(v.id);toast("Investimento excluído.");}}],"--c-invest"); break; }
    case "ativo-add": formAtivo(b.dataset.id); break;
    case "ativo-edit": formAtivo(b.dataset.id,b.dataset.a); break;
    case "ativo-del": { const v=getRec(b.dataset.id); const a=v&&(v.ativos||[]).find(x=>x.id===b.dataset.a); if(!a) break; const c=ativoCalc(a);
      ask("Remover da carteira",`Remover <b>${esc(a.codigo)}</b> (${money(c.atual)}) da carteira de ${esc(v.nome)}?<br><span class="note">Use quando vender o ativo. O valor atual do investimento não muda sozinho: se o dinheiro saiu, registre um resgate.</span>`,[{label:"Remover",cls:"danger",fn:()=>{const y=getRec(v.id); y.ativos=(y.ativos||[]).filter(x=>x.id!==a.id); saveRec(y); toast(`${a.codigo} removido da carteira.`);}},{label:"Remover e registrar resgate",cls:"pri",fn:()=>{const y=getRec(v.id); y.ativos=(y.ativos||[]).filter(x=>x.id!==a.id); y.movimentos=y.movimentos||[]; y.movimentos.push({id:uid("m"),tipo:"resgate",data:todayStr(),valor:c.atual,obs:"Venda de "+a.codigo,fluxo:true}); saveRec(y); toast(`${a.codigo} vendido: resgate de ${money(c.atual)} registrado.`);}}],"--c-invest"); break; }
    case "cart-sync": { const v=getRec(b.dataset.id); if(!v) break; formInvest(v.id,"valorAtual"); setTimeout(()=>{ const el=$("#valorAtual"); if(el){ el.value=mIn(carteiraResumo(v).atual); el.dispatchEvent(new Event("input",{bubbles:true})); } },80); break; }
    case "del-mov": { const v=getRec(b.dataset.id); if(!v) break; v.movimentos=(v.movimentos||[]).filter(m=>m.id!==b.dataset.m); saveRec(v); toast("Movimento excluído."); break; }
    case "ask": { const fn=ask.btns?.[+b.dataset.i]?.fn; closeModal(); fn&&fn(); break; }
    case "close": closeModal(); break;
    case "backup-json": download(`money-meus-dados-${todayStr()}.json`, JSON.stringify({versao:1,exportado:new Date().toISOString(),registros:[...recs.values()]},null,2)); break;
    case "backup-csv": download(`lancamentos-${todayStr()}.csv`, csvAll()); break;
    case "import": $("#importFile").click(); break;
  }
});
function aiAsk(){}
document.addEventListener("submit", ev=>{ if(ev.target.id==="lkform"){ ev.preventDefault(); lockSubmit(ev.target); return; } if(ev.target.id==="cadform"||ev.target.id==="pinform"||ev.target.id==="pwform"){ ev.preventDefault(); cadSubmit(ev.target); return; } const sc=ev.target.dataset&&ev.target.dataset.aiform; if(sc){ ev.preventDefault(); const el=document.getElementById("ai-in-"+sc); const q=el?el.value:""; if(el) el.value=""; aiAsk(sc,q); return; } if(ev.target.id==="mform"){ ev.preventDefault(); modalSubmit&&modalSubmit(new FormData(ev.target)); } });
document.addEventListener("input", ev=>{
  if (ev.target.classList && ev.target.classList.contains("pin")) { ev.target.value=soDig(ev.target.value).slice(0,4); if(ev.target.id==="lg_pin"&&ev.target.value.length===4) $("#lkform")?.requestSubmit(); if(ev.target.id==="gt_pin"&&ev.target.value.length===4) $("#mform")?.requestSubmit(); return; }
  if (["cd_cpf","pf_cpf","rs_cpf"].includes(ev.target.id)) { ev.target.value=fmtCPF(ev.target.value); return; }
  if (["cd_tel","pf_tel"].includes(ev.target.id)) { ev.target.value=fmtTel(ev.target.value); return; }
  if (ev.target.id==="adm-busca"){ adminBusca=ev.target.value; render(); return; }
  const f = ev.target.dataset && ev.target.dataset.filter;
  if (f){ if(f==="todos") ui.todos=ev.target.checked; else ui[f]=ev.target.value; render(); return; }
  if (ev.target.id==="venc1") ev.target.dataset.touched="1";
  if (ev.target.closest("#mform") && modalInput) modalInput(new FormData($("#mform")));
});
document.addEventListener("change", ev=>{
  if (ev.target.classList && ev.target.classList.contains("tgpref")){ const p={...(tgSt?.prefs||{})}; p[ev.target.dataset.k]=ev.target.checked; tgSt.prefs=p; sb.rpc("telegram_prefs",{p}).then(({error})=>toast(error?"Não foi possível salvar.":"Preferência salva.")); return; }
  if (ev.target.name==="pin_modo" && ev.target.closest("#pinform")){ const modo=ev.target.value; const p=clone(perfil()||{id:PERFIL_ID,tipo:"config"});
    if(modo==="livre"){ if(!pinAtivo()) return; pedirPin("Liberar acesso sem senha rápida", ()=>{ p.pinLivre=true; saveRec(p); ui.sec=false; clearTimeout(idleT); toast("Pronto: Compromissos e Patrimônio abrem sem senha rápida."); render(); }); return; }
    if(!p.pinHash){ toast("Crie a senha rápida nos campos abaixo para ativar."); setTimeout(()=>$("#ps_nova")?.focus(),50); render(); return; }
    delete p.pinLivre; saveRec(p); ui.sec=false; armIdle(); toast("Senha rápida ativada."); render(); return; }
  if (ev.target.id==="forma" && ev.target.value==="__cartao__"){ const fd=new FormData($("#mform")); const pre={descricao:fd.get("descricao")||"",valor:parseMoney(fd.get("valor"))||"",categoria:fd.get("categoria")!=="__nova__"?fd.get("categoria"):""}; closeModal(); formCompra(null,pre); return; }
  if (ev.target.classList && ev.target.classList.contains("regper")){ ui.regPer=ev.target.value; if(ui.regPer==="custom"&&!ui.regDe){ ui.regDe=addMonths(todayStr(),-6); ui.regAte=todayStr(); } render(); return; }
  if (ev.target.classList && (ev.target.classList.contains("regde")||ev.target.classList.contains("regate"))){ if(ev.target.value){ if(ev.target.classList.contains("regde")) ui.regDe=ev.target.value; else ui.regAte=ev.target.value; render(); } return; }
  if (ev.target.id==="fx-saldo"){ const cfg=clone(fluxoCfg()); cfg.saldos=cfg.saldos||{}; cfg.saldos[ui.fxIni]=r2(parseMoney(ev.target.value)); saveRec(cfg); return; }
  if (ev.target.id==="fx-n"){ if(ev.target.value==="mes"){ ui.fxMes=true; ui.fxAno=false; ui.fxN=1; ui.fxIni=todayStr().slice(0,7); } else if(ev.target.value==="ano"){ ui.fxMes=false; ui.fxAno=true; ui.fxN=12; ui.fxIni=ui.fxIni.slice(0,4)+"-01"; } else { if(ui.fxMes) ui.fxIni=shiftMonth(ui.fxIni,-2); ui.fxMes=false; ui.fxAno=false; ui.fxN=+ev.target.value; } render(); return; }
  if (ev.target.name==="fxModo" && !ev.target.closest("#mform")){ ui.fxModo=ev.target.value; render(); return; }
  if (ev.target.name==="dreModo"){ ui.dreModo=ev.target.value; render(); return; }
  if (ev.target.tagName==="SELECT" && ev.target.id){ const nv=document.getElementById(ev.target.id+"_nova"); if(nv){ nv.hidden = ev.target.value!=="__nova__"; if(!nv.hidden) nv.focus(); } }
  if (ev.target.closest && ev.target.closest("#mform") && modalInput) modalInput(new FormData($("#mform")));
});
document.addEventListener("keydown", ev=>{ if(ev.key==="Enter" && ev.target.id==="at_novo"){ ev.preventDefault(); chipAdd(); return; } if(ev.key==="Enter" && ev.target.dataset && ev.target.dataset.catadd){ ev.preventDefault(); document.querySelector(`[data-act="cat-add"][data-nat="${ev.target.dataset.catadd}"]`)?.click(); return; } if(ev.key==="Escape" && $("#modalRoot").innerHTML) closeModal(); });
$("#importFile").addEventListener("change", async ev=>{
  const file=ev.target.files[0]; ev.target.value=""; if(!file) return;
  try{ const j=JSON.parse(await file.text()); const list=Array.isArray(j)?j:j.registros; if(!Array.isArray(list)) throw 0;
    const ok=list.filter(r=>r&&r.id&&["lanc","contrato","invest","config"].includes(r.tipo));
    ask("Restaurar backup",`Importar ${ok.length} registro(s)? Registros com o mesmo identificador serão substituídos; os demais continuam.`,[{label:"Importar",cls:"pri",fn:()=>{ok.forEach(r=>saveRec(r));toast(`${ok.length} registro(s) importados.`);}}]);
  }catch(e){ toast("Arquivo inválido. Use um backup gerado por este controle."); }
});

initStore();

})();
</script>

<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
