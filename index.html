    case "adm-recarregar": adminLista=null; render(); break;
    case "adm-tg": (async()=>{ const on=b.dataset.on==="1"; const {error}=await sb.rpc("admin_telegram",{p_email:b.dataset.email,p_liberar:on}); toast(error?"Não foi possível alterar.":on?"Telegram liberado.":"Telegram retirado."); adminLista=null; render(); })(); break;
    case "adm-csv": { const L=Array.isArray(adminLista)?adminLista:[]; const q=v=>`"${String(v??"").replace(/"/g,'""')}"`; download(`fluxxu-usuarios-${todayStr()}.csv`, "\ufeff"+["Nome;E-mail;Telefone;Cadastro;Último acesso;Última atividade;Telegram"].concat(L.map(u=>[u.nome,u.email,u.telefone,(u.cadastro||"").slice(0,10),(u.ultimo_acesso||"").slice(0,10),(u.ultima_atividade||"").slice(0,10),u.telegram_conectado?"conectado":u.telegram_liberado?"liberado":""].map(q).join(";"))).join("\n")); break; }
    case "tg-gerar": (async()=>{ const {data,error}=await sb.rpc("telegram_gerar_codigo"); if(error){ toast("Não foi possível gerar o código."); return; } tgCod=data; render(); })(); break;
    case "tg-atualizar": tgCod=null; tgCarregar(true); break;
    case "tg-desc": ask("Desconectar Telegram","O bot deixa de responder e de mandar alertas. Você pode conectar de novo quando quiser.",[{label:"Desconectar",cls:"danger",fn:async()=>{ await sb.rpc("telegram_desconectar"); tgCod=null; await tgCarregar(true); toast("Telegram desconectado."); }}]); break;
    case "mes": ui.mes=shiftMonth(ui.mes,+b.dataset.d*(ui.per==="ano"?12:1)); render(); break;
    case "per": ui.per=b.dataset.p; render(); break;
    case "pdf": gerarPDF(); break;
    case "fx-mes": ui.fxIni=shiftMonth(ui.fxIni,+b.dataset.d*(ui.fxAno?12:ui.fxN>=6?3:1)); render(); break;
    case "pago": togglePago(b.dataset.key); break;
    case "novo-lanc": formLanc(b.dataset.nat); break;
    case "edit-lanc": { const r=getRec(b.dataset.id); r&&formLanc(r.natureza,r.id); break; }
    case "del-lanc": { const r=getRec(b.dataset.id); if(!r) break; const fut=r.grupo?byTipo("lanc").filter(x=>x.grupo===r.grupo&&x.vencimento>r.vencimento):[];
      ask("Excluir lançamento",`Excluir <b>${esc(r.descricao)}</b> de ${dt(r.vencimento)}?`,[{label:"Excluir",cls:"danger",fn:()=>{delRec(r.id);toast("Lançamento excluído.");}},...(fut.length?[{label:`Excluir este e os próximos (${fut.length})`,cls:"danger",fn:()=>{delRec(r.id);fut.forEach(x=>delRec(x.id));toast(`${fut.length+1} lançamentos excluídos.`);}}]:[])], r.natureza==="pagar"?"--c-pagar":"--c-receber"); break; }
    case "toggle-dash": ui.dash.has(b.dataset.id)?ui.dash.delete(b.dataset.id):ui.dash.add(b.dataset.id); render(); break;
    case "chip-add": chipAdd(); break;
    case "chip-del": formInvest.tmp=(formInvest.tmp||[]).filter(a=>a.id!==b.dataset.a); { const c=$("#achips"); if(c) c.innerHTML=chipsHtml(); } break;
    case "edit-item-cartao": formItemCartao(b.dataset.id); break;
    case "close-edit-compra": closeModal(); formCompra(b.dataset.g); break;
    case "nova-compra": formCompra(null, b.dataset.k&&!b.dataset.k.startsWith("n:")?{cartaoId:b.dataset.k}:null); break;
    case "cartao-novo": formCartao(); break;
    case "cartao-edit": formCartao(b.dataset.id); break;
    case "cartao-reg": { closeModal(); formCartao(); setTimeout(()=>{const el=$("#cc_nome"); if(el) el.value=b.dataset.n;},80); break; }
    case "cartao-del": { const c=cartoes().find(x=>x.id===b.dataset.id); if(!c) break; const n=byTipo("lanc").filter(r=>r.cartaoId===c.id).length;
      ask("Excluir cartão",`Excluir o cartão <b>${esc(cardLabel(c))}</b>?${n?` Os ${n} lançamentos dele continuam salvos com o nome do cartão.`:""}`,[{label:"Excluir cartão",cls:"danger",fn:()=>{const cfg=clone(cardsCfg()); cfg.cartoes=cfg.cartoes.filter(x=>x.id!==c.id); saveRec(cfg); byTipo("lanc").filter(r=>r.cartaoId===c.id).forEach(r=>{const y=clone(r);y.cartaoId=null;saveRec(y);}); toast("Cartão excluído.");}}],"--c-cartao"); break; }
    case "goto-fatura": ui.view="cartao"; ui.per="mes"; ui.mes=b.dataset.m; render(); window.scrollTo(0,0); break;
    case "edit-compra": formCompra(b.dataset.g); break;
    case "del-compra": { const it=byTipo("lanc").filter(r=>(r.grupo||r.id)===b.dataset.g); ask("Excluir compra",`Excluir <b>${esc(it[0]?.descricao)}</b> e suas ${it.length} parcela(s)?`,[{label:"Excluir compra",cls:"danger",fn:()=>{it.forEach(x=>delRec(x.id));toast("Compra excluída.");}}],"--c-cartao"); break; }
    case "fatura": { const v=b.dataset.v==="1"; byTipo("lanc").filter(r=>isCard(r)&&cardKey(r)===b.dataset.k&&(ui.per==="ano"&&!b.dataset.m?inPer(r.vencimento):r.vencimento.slice(0,7)===(b.dataset.m||ui.mes))&&!!r.pago!==v).forEach(r=>{const y=clone(r);y.pago=v;y.dataPagamento=v?todayStr():null;saveRec(y);}); toast(v?"Fatura marcada como paga.":"Fatura reaberta."); break; }
    case "novo-contrato": formContrato(b.dataset.mod); break;
    case "fluxo-contrato": { const c0=getRec(b.dataset.id); if(!c0) break; const c=clone(c0); const lancar=foraFluxo(c);
      if(c.modalidade==="aquisicao") c.comFluxo=lancar; else c.semFluxo=!lancar; saveRec(c);
      const nat=MODS[c.modalidade].nat; toast(lancar?`Parcelas lançadas em contas a ${nat} e no fluxo.`:"Agora é só anotação: saiu de contas e do fluxo."); break; }
    case "edit-contrato": { const c=getRec(b.dataset.id); c&&formContrato(c.modalidade,c.id); break; }
    case "open-contrato": ui.open.add(b.dataset.id); goView(b.dataset.mod, ()=>setTimeout(()=>{const el=document.getElementById("ct-"+b.dataset.id); el&&el.scrollIntoView({block:"start"});},50)); break;
    case "del-contrato": { const c=getRec(b.dataset.id); if(!c) break; ask("Excluir registro",`Excluir <b>${esc(c.nome)}</b>? Todas as ${c.parcelas?.length||0} parcelas saem de contas a ${MODS[c.modalidade].nat}.`,[{label:"Excluir",cls:"danger",fn:()=>{delRec(c.id);toast("Registro excluído.");}}],`--c-${c.modalidade}`); break; }
    case "cc-open": { const k="ct:"+b.dataset.k; ui.open.has(k)?ui.open.delete(k):ui.open.add(k); render(); break; }
    case "row-card": { const k="rc:"+b.dataset.k; ui.open.has(k)?ui.open.delete(k):ui.open.add(k); render(); break; }
    case "toggle-parcelas": ui.open.has(b.dataset.id)?ui.open.delete(b.dataset.id):ui.open.add(b.dataset.id); render(); break;
    case "tx-add": { const w=$("#taxas"); w.insertAdjacentHTML("beforeend",formContrato.taxRow({tipo:"mensal"})); w.lastElementChild.querySelector("input").focus(); modalInput&&modalInput(new FormData($("#mform"))); break; }
    case "tx-del": b.closest("[data-tax]").remove(); modalInput&&modalInput(new FormData($("#mform"))); break;
    case "novo-invest": formInvest(); break;
    case "edit-parcela": formParcela(b.dataset.id,b.dataset.idx); break;
    case "parc-restaurar": closeModal(); restaurarParcela(b.dataset.id,b.dataset.idx); break;
    case "cat-add": { const el=document.getElementById("nc-"+b.dataset.nat); const n=(el?.value||"").trim(); if(!n){toast("Digite o nome da categoria.");el&&el.focus();break;} if(catList(b.dataset.nat).some(x=>x.nome.toLowerCase()===n.toLowerCase())){toast("Essa categoria já existe.");break;} addCategoria(b.dataset.nat,n); el.value=""; toast("Categoria criada."); break; }
    case "cat-edit": formCategoria(b.dataset.nat,b.dataset.n); break;
    case "cat-del": formCategoriaDel(b.dataset.nat,b.dataset.n); break;
    case "edit-invest": formInvest(b.dataset.id,"nome"); break;
    case "atualizar-invest": formInvest(b.dataset.id,"valorAtual"); break;
    case "aporte-invest": formInvest(b.dataset.id,"aporte"); break;
    case "mov-invest": formMov(b.dataset.id); break;
    case "saldo-invest": formSaldo(b.dataset.id); break;
    case "del-invest": { const v=getRec(b.dataset.id); if(!v) break; ask("Excluir investimento",`Excluir <b>${esc(v.nome)}</b> e todo o histórico de movimentos?`,[{label:"Excluir",cls:"danger",fn:()=>{delRec(v.id);toast("Investimento excluído.");}}],"--c-invest"); break; }
    case "ativo-add": formAtivo(b.dataset.id); break;
    case "ativo-edit": formAtivo(b.dataset.id,b.dataset.a); break;
    case "ativo-del": { const v=getRec(b.dataset.id); const a=v&&(v.ativos||[]).find(x=>x.id===b.dataset.a); if(!a) break; const c=ativoCalc(a);
      ask("Remover da carteira",`Remover <b>${esc(a.codigo)}</b> (${money(c.atual)}) da carteira de ${esc(v.nome)}?<br><span class="note">Use quando vender o ativo. O valor atual do investimento não muda sozinho: se o dinheiro saiu, registre um resgate.</span>`,[{label:"Remover",cls:"danger",fn:()=>{const y=getRec(v.id); y.ativos=(y.ativos||[]).filter(x=>x.id!==a.id); saveRec(y); toast(`${a.codigo} removido da carteira.`);}},{label:"Remover e registrar resgate",cls:"pri",fn:()=>{const y=getRec(v.id); y.ativos=(y.ativos||[]).filter(x=>x.id!==a.id); y.movimentos=y.movimentos||[]; y.movimentos.push({id:uid("m"),tipo:"resgate",data:todayStr(),valor:c.atual,obs:"Venda de "+a.codigo,fluxo:true}); saveRec(y); toast(`${a.codigo} vendido: resgate de ${money(c.atual)} registrado.`);}}],"--c-invest"); break; }
    case "cart-sync": { const v=getRec(b.dataset.id); if(!v) break; formInvest(v.id,"valorAtual"); setTimeout(()=>{ const el=$("#valorAtual"); if(el){ el.value=mIn(carteiraResumo(v).atual); el.dispatchEvent(new Event("input",{bubbles:true})); } },80); break; }
    case "del-mov": { const v=getRec(b.dataset.id); if(!v) break; v.movimentos=(v.movimentos||[]).filter(m=>m.id!==b.dataset.m); saveRec(v); toast("Movimento excluído."); break; }
    case "ask": { const fn=ask.btns?.[+b.dataset.i]?.fn; closeModal(); fn&&fn(); break; }
    case "close": closeModal(); break;
    case "backup-json": download(`fluxxu-meus-dados-${todayStr()}.json`, JSON.stringify({versao:1,exportado:new Date().toISOString(),registros:[...recs.values()]},null,2)); break;
    case "backup-csv": download(`lancamentos-${todayStr()}.csv`, csvAll()); break;
    case "import": $("#importFile").click(); break;
  }
});
function aiAsk(){}
document.addEventListener("submit", ev=>{ if(ev.target.id==="lkform"){ ev.preventDefault(); lockSubmit(ev.target); return; } if(ev.target.id==="cadform"||ev.target.id==="pinform"||ev.target.id==="pwform"){ ev.preventDefault(); cadSubmit(ev.target); return; } const sc=ev.target.dataset&&ev.target.dataset.aiform; if(sc){ ev.preventDefault(); const el=document.getElementById("ai-in-"+sc); const q=el?el.value:""; if(el) el.value=""; aiAsk(sc,q); return; } if(ev.target.id==="mform"){ ev.preventDefault(); modalSubmit&&modalSubmit(new FormData(ev.target)); } });
document.addEventListener("input", ev=>{
  if (ev.target.classList && ev.target.classList.contains("pin")) { ev.target.value=soDig(ev.target.value).slice(0,4); if(ev.target.id==="lg_pin"&&ev.target.value.length===4) $("#lkform")?.requestSubmit(); if(ev.target.id==="gt_pin"&&ev.target.value.length===4) $("#mform")?.requestSubmit(); return; }
  if (["cd_cpf","pf_cpf","rs_cpf"].includes(ev.target.id)) { ev.target.value=fmtCPF(ev.target.value); return; }
  if (["cd_tel","pf_tel"].includes(ev.target.id)) { ev.target.value=fmtTel(ev.target.value); return; }
  if (ev.target.id==="adm-busca"){ adminBusca=ev.target.value; render(); return; }
  const f = ev.target.dataset && ev.target.dataset.filter;
  if (f){ if(f==="todos") ui.todos=ev.target.checked; else ui[f]=ev.target.value; render(); return; }
  if (ev.target.id==="venc1") ev.target.dataset.touched="1";
  if (ev.target.closest("#mform") && modalInput) modalInput(new FormData($("#mform")));
});
document.addEventListener("change", ev=>{
  if (ev.target.classList && ev.target.classList.contains("tgpref")){ const p={...(tgSt?.prefs||{})}; p[ev.target.dataset.k]=ev.target.checked; tgSt.prefs=p; sb.rpc("telegram_prefs",{p}).then(({error})=>toast(error?"Não foi possível salvar.":"Preferência salva.")); return; }
  if (ev.target.name==="pin_modo" && ev.target.closest("#pinform")){ const modo=ev.target.value; const p=clone(perfil()||{id:PERFIL_ID,tipo:"config"});
    if(modo==="livre"){ if(!pinAtivo()) return; pedirPin("Liberar acesso sem senha rápida", ()=>{ p.pinLivre=true; saveRec(p); ui.sec=false; clearTimeout(idleT); toast("Pronto: Compromissos e Patrimônio abrem sem senha rápida."); render(); }); return; }
    if(!p.pinHash){ toast("Crie a senha rápida nos campos abaixo para ativar."); setTimeout(()=>$("#ps_nova")?.focus(),50); render(); return; }
    delete p.pinLivre; saveRec(p); ui.sec=false; armIdle(); toast("Senha rápida ativada."); render(); return; }
  if (ev.target.id==="forma" && ev.target.value==="__cartao__"){ const fd=new FormData($("#mform")); const pre={descricao:fd.get("descricao")||"",valor:parseMoney(fd.get("valor"))||"",categoria:fd.get("categoria")!=="__nova__"?fd.get("categoria"):""}; closeModal(); formCompra(null,pre); return; }
  if (ev.target.classList && ev.target.classList.contains("regper")){ ui.regPer=ev.target.value; if(ui.regPer==="custom"&&!ui.regDe){ ui.regDe=addMonths(todayStr(),-6); ui.regAte=todayStr(); } render(); return; }
  if (ev.target.classList && (ev.target.classList.contains("regde")||ev.target.classList.contains("regate"))){ if(ev.target.value){ if(ev.target.classList.contains("regde")) ui.regDe=ev.target.value; else ui.regAte=ev.target.value; render(); } return; }
  if (ev.target.id==="fx-saldo"){ const cfg=clone(fluxoCfg()); cfg.saldos=cfg.saldos||{}; cfg.saldos[ui.fxIni]=r2(parseMoney(ev.target.value)); saveRec(cfg); return; }
  if (ev.target.id==="fx-n"){ if(ev.target.value==="mes"){ ui.fxMes=true; ui.fxAno=false; ui.fxN=1; ui.fxIni=todayStr().slice(0,7); } else if(ev.target.value==="ano"){ ui.fxMes=false; ui.fxAno=true; ui.fxN=12; ui.fxIni=ui.fxIni.slice(0,4)+"-01"; } else { if(ui.fxMes) ui.fxIni=shiftMonth(ui.fxIni,-2); ui.fxMes=false; ui.fxAno=false; ui.fxN=+ev.target.value; } render(); return; }
  if (ev.target.name==="fxModo" && !ev.target.closest("#mform")){ ui.fxModo=ev.target.value; render(); return; }
  if (ev.target.name==="dreModo"){ ui.dreModo=ev.target.value; render(); return; }
  if (ev.target.tagName==="SELECT" && ev.target.id){ const nv=document.getElementById(ev.target.id+"_nova"); if(nv){ nv.hidden = ev.target.value!=="__nova__"; if(!nv.hidden) nv.focus(); } }
  if (ev.target.closest && ev.target.closest("#mform") && modalInput) modalInput(new FormData($("#mform")));
});
document.addEventListener("keydown", ev=>{ if(ev.key==="Enter" && ev.target.id==="at_novo"){ ev.preventDefault(); chipAdd(); return; } if(ev.key==="Enter" && ev.target.dataset && ev.target.dataset.catadd){ ev.preventDefault(); document.querySelector(`[data-act="cat-add"][data-nat="${ev.target.dataset.catadd}"]`)?.click(); return; } if(ev.key==="Escape" && $("#modalRoot").innerHTML) closeModal(); });
$("#importFile").addEventListener("change", async ev=>{
  const file=ev.target.files[0]; ev.target.value=""; if(!file) return;
  try{ const j=JSON.parse(await file.text()); const list=Array.isArray(j)?j:j.registros; if(!Array.isArray(list)) throw 0;
    const ok=list.filter(r=>r&&r.id&&["lanc","contrato","invest","config"].includes(r.tipo));
    ask("Restaurar backup",`Importar ${ok.length} registro(s)? Registros com o mesmo identificador serão substituídos; os demais continuam.`,[{label:"Importar",cls:"pri",fn:()=>{ok.forEach(r=>saveRec(r));toast(`${ok.length} registro(s) importados.`);}}]);
  }catch(e){ toast("Arquivo inválido. Use um backup gerado por este controle."); }
});

initStore();

})();
</script>

<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
